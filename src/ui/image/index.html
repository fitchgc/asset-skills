<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asynx Local UI Workbench · 图片工作台</title>
  <link rel="stylesheet" href="/plaiers.css">
  <style>
    body { user-select: none; }
    #session-title { font-weight: 700; color: var(--text); }

    /* 图片层与批注层 */
    #image-frame-container { position: absolute; overflow: hidden; border-radius: var(--r-xs); outline: 2px solid var(--n800); }
    #source-image-view { display: block; width: 100%; height: 100%; object-fit: fill; user-select: none; -webkit-user-drag: none; }
    #stage-canvas { position: absolute; inset: 0; z-index: 20; width: 100%; height: 100%; touch-action: none; }
    #stage-canvas:is(.tool-brush, .tool-annotation, .tool-rectangle, .tool-lasso) { cursor: crosshair; }
    #stage-canvas.tool-edit { cursor: text; }
    #stage-canvas.tool-delete { cursor: not-allowed; }

    /* 浮动修改输入框：画完一处标记后在旁边写要怎么改，字色跟批注线一致 */
    #text-draft-form { position: absolute; z-index: 50; display: none; width: 280px; height: 44px; align-items: center; gap: 6px; padding: 0 6px; background: var(--n900); border: 2px solid var(--n700); border-radius: var(--r-md); box-shadow: 4px 4px 0 var(--hard); }
    .text-draft-indicator { flex: none; width: 3px; height: 20px; margin-left: 2px; border-radius: var(--r-pill); background: var(--mark); }
    .text-draft-input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; font: 500 13px/1 var(--cn); color: var(--mark); background: var(--n950); border: 1px solid var(--n800); border-radius: var(--r-sm); outline: none; }
    .text-draft-input:focus { border-color: var(--coin); }
    .text-draft-input::placeholder { color: var(--n500); font-weight: 400; }
    #text-draft-form .pl-iconbtn { width: 30px; height: 30px; }

    /* 底部控制台（局部重绘） */
    #region-composer { position: absolute; left: 50%; bottom: 16px; z-index: 40; transform: translateX(-50%); width: min(960px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--n900); border: 2px solid var(--n700); border-radius: var(--r-xl); box-shadow: 4px 4px 0 var(--hard); }
    #region-prompt { min-height: 64px; height: 64px; resize: none; }
    .composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .composer-tools { display: flex; align-items: center; gap: 8px; min-width: 0; overflow-x: auto; }
    .composer-tools .pl-seg { flex-wrap: nowrap; }
    #brush-size-controls { display: none; }
    .composer-actions { display: flex; align-items: center; gap: 10px; flex: none; }
    #model-select { width: auto; max-width: 200px; }

    /* 图片处理面板 */
    #tools-panel { position: absolute; top: 16px; right: 16px; bottom: 16px; z-index: 40; width: min(320px, calc(100% - 32px)); display: none; flex-direction: column; gap: 16px; padding: 20px; overflow-y: auto; background: var(--n900); border: 2px solid var(--n700); border-radius: var(--r-xl); box-shadow: 4px 4px 0 var(--hard); }
    #tools-panel h2 { font: 900 17px/1.3 var(--cn); }
    .recipe-list { display: grid; gap: 4px; margin: 0 -8px; }
    .recipe-btn { display: grid; gap: 2px; padding: 10px 12px; text-align: left; background: none; border: 0; border-radius: var(--r-md); color: var(--text); font-size: 14px; font-weight: 700; }
    .recipe-btn small { font-size: 12px; font-weight: 400; color: var(--n400); }
    .recipe-btn:hover { background: var(--n850); }
    .tools-divider { height: 1px; border: 0; margin: 0; background: var(--n800); }

    #loading-text { max-width: 560px; }
  </style>
</head>
<body class="pl-portal wb-app">
  <header class="wb-top">
    <div class="pl-seg" role="group" aria-label="工作模式">
      <button type="button" class="tab-btn" id="tab-btn-view" aria-pressed="false" onclick="setAppMode('view')">查看</button>
      <button type="button" class="tab-btn" id="tab-btn-tools" aria-pressed="false" onclick="setAppMode('tools')">图片处理</button>
      <button type="button" class="tab-btn" id="tab-btn-region" aria-pressed="true" onclick="setAppMode('region_edit')">局部重绘</button>
    </div>
    <span id="session-title">局部重绘</span>
    <span id="image-dimensions" class="wb-meta">载入中</span>
    <div class="wb-actions">
      <div id="account-bar-slot"></div>
      <button type="button" class="btn-text" id="cancel-btn">取消</button>
      <button type="button" class="keycap ghost sm" id="finish-btn">完成</button>
    </div>
  </header>

  <main class="wb-main">
    <div id="stage-viewport" class="wb-stage">
      <div id="image-frame-container" class="wb-checker">
        <img id="source-image-view" alt="工作图" />
      </div>

      <canvas id="stage-canvas" class="tool-annotation"></canvas>

      <!-- 浮动文字输入框（指向、框选、圈选绘制完成或编辑时弹出） -->
      <form id="text-draft-form">
        <span class="text-draft-indicator"></span>
        <input type="text" id="text-draft-input" class="text-draft-input" placeholder="这里要怎么改" autocomplete="off" />
        <button type="submit" class="pl-iconbtn go" title="确认文字" aria-label="确认文字"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-check"></use></svg></button>
        <button type="button" class="pl-iconbtn plain" id="text-draft-cancel-btn" title="取消文字" aria-label="取消文字"><svg class="i sm" aria-hidden="true"><use href="/plaiers-icons.svg#pi-close"></use></svg></button>
      </form>

      <!-- 底部控制台（局部重绘模式） -->
      <div id="region-composer">
        <textarea id="region-prompt" class="pl-input" placeholder="整体修改要求（可选）"></textarea>
        <div class="composer-bottom">
          <div class="composer-tools">
            <div class="pl-seg" role="group" aria-label="标记工具">
              <button type="button" class="tool-btn" id="tool-brush" aria-pressed="false" onclick="setTool('brush')"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-brush"></use></svg>涂鸦</button>
              <button type="button" class="tool-btn" id="tool-annotation" aria-pressed="true" onclick="setTool('annotation')"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-point"></use></svg>指向</button>
              <button type="button" class="tool-btn" id="tool-rectangle" aria-pressed="false" onclick="setTool('rectangle')"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-rect"></use></svg>框选</button>
              <button type="button" class="tool-btn" id="tool-lasso" aria-pressed="false" onclick="setTool('lasso')"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-lasso"></use></svg>圈选</button>
              <button type="button" class="tool-btn" id="tool-edit" aria-pressed="false" onclick="setTool('edit')"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-edit"></use></svg>编辑</button>
              <button type="button" class="tool-btn" id="tool-delete" aria-pressed="false" onclick="setTool('delete')"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-erase"></use></svg>删除</button>
            </div>
            <div id="brush-size-controls" class="pl-seg" role="group" aria-label="笔刷大小">
              <button type="button" aria-pressed="false" onclick="setBrushRadius(12, this)">细</button>
              <button type="button" aria-pressed="true" onclick="setBrushRadius(24, this)">中</button>
              <button type="button" aria-pressed="false" onclick="setBrushRadius(48, this)">粗</button>
            </div>
            <button type="button" class="btn-text" onclick="clearMarks()"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-trash"></use></svg>清空标记</button>
          </div>

          <div class="composer-actions">
            <select id="model-select" class="pl-input sm" aria-label="模型">
              <!-- 模型由 session.models 填充，默认支持 GPT Image 2 -->
              <option value="gpt-image-2.5-sunburst">GPT Image 2</option>
            </select>
            <button type="button" class="keycap sm" id="submit-btn" onclick="handleSubmit()">开始重绘</button>
          </div>
        </div>
      </div>

      <!-- 图片处理面板（图片处理模式） -->
      <div id="tools-panel">
        <h2>图片预处理</h2>
        <div class="recipe-list">
          <button type="button" class="recipe-btn" onclick="applyRecipe('remove_background')">抠除背景<small>按左上角颜色去掉纯色背景</small></button>
          <button type="button" class="recipe-btn" onclick="applyRecipe('trim_transparent')">裁掉透明边<small>只保留有内容的区域</small></button>
          <button type="button" class="recipe-btn" onclick="applyRecipe('inventory_icon')">做成物品图标<small>裁透明边后缩放到 64 × 64</small></button>
          <button type="button" class="recipe-btn" onclick="resetToOriginal()">还原原图<small>撤销以上所有处理</small></button>
        </div>
        <hr class="tools-divider" />
        <div class="pl-field">
          <span>调整尺寸（宽 / 高）</span>
          <div class="wb-grid2">
            <input type="number" id="resize-w" placeholder="宽" aria-label="宽" />
            <input type="number" id="resize-h" placeholder="高" aria-label="高" />
          </div>
        </div>
        <button type="button" class="keycap ghost sm" onclick="applyResize()">应用尺寸</button>
        <div class="sp"></div>
        <button type="button" class="keycap block" onclick="submitToolImage()">保存修改</button>
      </div>
    </div>
  </main>

  <div id="loading-overlay" class="wb-busy" role="status">
    <div class="wb-spinner"></div>
    <p id="loading-text">处理中…</p>
  </div>

  <script src="/plaiers-ui.js"></script>
  <script src="/account-bar.js"></script>
  <script>
    // 常量定义（参考 image-flow 规范）
    const ANNOTATION_COLOR = '#ef4444'; // 和 plaiers.css 的 --mark 同值：批注预览会交给模型，颜色要稳定
    const ANNOTATION_LINE_WIDTH = 2.1;
    const MASK_STROKE_WIDTH = 2;
    const ANNOTATION_FONT_SIZE = 13;
    const ANNOTATION_MIN_LENGTH = 10;
    const LASSO_MIN_SCREEN_DISTANCE = 3;
    const LASSO_MIN_POINTS = 3;
    const ARROW_TARGET_MASK_MIN_SIZE = 32;
    const ARROW_TARGET_MASK_RATIO = 0.08;
    const TEXT_DRAFT_WIDTH = 280;
    const TEXT_DRAFT_HEIGHT = 40;
    const TEXT_DRAFT_OFFSET_X = 12;
    const TEXT_DRAFT_OFFSET_Y = 12;
    const TEXT_DRAFT_EDGE_MARGIN = 16;

    // 状态管理
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || window.location.hash.replace('#token=', '');
    const isEmbedded = urlParams.get('embedded') === '1';
    const paramSourcePath = urlParams.get('source_path') || '';
    const paramMode = urlParams.get('mode') || '';
    let session = null;
    let appMode = 'region_edit'; // 'view' | 'tools' | 'region_edit'
    let currentTool = 'annotation'; // 'annotation' | 'rectangle' | 'lasso' | 'edit' | 'delete'
    let marks = [];
    let draft = null;
    let textDraft = null;
    let hoveredMarkId = null;
    let isPointerDown = false;

    // 图像与几何数据
    let sourceImage = new Image();
    let currentImageCanvas = document.createElement('canvas'); // 保存当前编辑后的像素
    let stageSize = { width: 0, height: 0 };
    let imageFrame = { left: 0, top: 0, width: 0, height: 0 };
    let sourceWidth = 0;
    let sourceHeight = 0;

    // DOM 元素
    const stageViewport = document.getElementById('stage-viewport');
    const imageFrameContainer = document.getElementById('image-frame-container');
    const sourceImageView = document.getElementById('source-image-view');
    const stageCanvas = document.getElementById('stage-canvas');
    const sCtx = stageCanvas.getContext('2d');
    const textDraftForm = document.getElementById('text-draft-form');
    const textDraftInput = document.getElementById('text-draft-input');
    const regionComposer = document.getElementById('region-composer');
    const toolsPanel = document.getElementById('tools-panel');

    // 辅助几何函数
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function clamp(val, min, max) {
      return Math.min(Math.max(val, min), max);
    }
    function distance(p1, p2) {
      return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }
    function createElementId() {
      return 'mark_' + Math.random().toString(36).slice(2, 10);
    }

    function fitContain(sw, sh, maxW, maxH) {
      const ratio = Math.min(maxW / sw, maxH / sh, 1);
      return {
        width: Math.max(1, Math.round(sw * ratio)),
        height: Math.max(1, Math.round(sh * ratio)),
      };
    }

    // 初始化
    async function init() {
      if (!isEmbedded && window.AsxAccountBar) {
        window.AsxAccountBar.mount('#account-bar-slot', { token });
      }
      if (isEmbedded) {
        const slot = document.getElementById('account-bar-slot');
        if (slot) slot.style.display = 'none';
      }
      try {
        const sessionQs = new URLSearchParams();
        if (paramSourcePath) sessionQs.set('source_path', paramSourcePath);
        if (paramMode) sessionQs.set('mode', paramMode);
        const sessionUrl = '/api/session' + (sessionQs.toString() ? '?' + sessionQs.toString() : '');
        const res = await fetch(sessionUrl, { headers: { 'X-Asx-Session-Token': token } });
        if (!res.ok) throw new Error('Unauthorized or session expired');
        session = await res.json();

        // 模型选项加载（优先默认选择支持局部重绘 Mask 的 gpt-image-2 模型）
        const modelSelect = document.getElementById('model-select');
        if (session.models && session.models.length > 0) {
          const editModels = session.models.filter(m => {
            const types = m.task_types || (m.capabilities && m.capabilities.task_types) || [];
            return !types.length || types.includes('image.edit');
          });
          const list = editModels.length > 0 ? editModels : session.models;
          modelSelect.innerHTML = list.map(m => {
            const name = m.name || m.id || m.label || m;
            const label = m.label || (name === 'gpt-image-2' ? 'GPT Image 2' : name);
            return `<option value="${name}">${label}</option>`;
          }).join('');
          const preferred = list.find(m => (m.name || m.id) === 'gpt-image-2') || list.find(m => String(m.name || m.id).startsWith('gpt-image'));
          if (preferred) {
            modelSelect.value = preferred.name || preferred.id;
          }
        }

        // 根据后端初始模式设置
        const initMode = paramMode || session.mode;
        if (initMode === 'tools' || initMode === 'image_tools') {
          setAppMode('tools');
        } else if (initMode === 'annotate' || initMode === 'image_annotate') {
          setAppMode('annotate');
        } else {
          setAppMode('region_edit');
        }

        sourceImage.crossOrigin = 'anonymous';
        sourceImage.onload = () => {
          sourceWidth = sourceImage.naturalWidth;
          sourceHeight = sourceImage.naturalHeight;
          currentImageCanvas.width = sourceWidth;
          currentImageCanvas.height = sourceHeight;
          const ctx = currentImageCanvas.getContext('2d');
          ctx.drawImage(sourceImage, 0, 0);

          sourceImageView.src = currentImageCanvas.toDataURL('image/png');
          document.getElementById('image-dimensions').textContent = `${sourceWidth} × ${sourceHeight}`;
          document.getElementById('resize-w').value = sourceWidth;
          document.getElementById('resize-h').value = sourceHeight;

          measureStage();
          render();
        };
        sourceImage.src = session.source_url
          ? (session.source_url.includes('?') ? session.source_url : session.source_url + '?token=' + encodeURIComponent(token))
          : ('/api/source?token=' + encodeURIComponent(token));
      } catch (err) {
        plToast('加载工作台失败：' + err.message, 'err', 8000);
      }
    }

    // 舞台测量与布局
    function measureStage() {
      const rect = stageViewport.getBoundingClientRect();
      stageSize.width = Math.max(10, Math.floor(rect.width));
      stageSize.height = Math.max(10, Math.floor(rect.height));

      const bottomSpace = appMode === 'region_edit' ? 140 : 40;
      const safeW = Math.max(10, stageSize.width - 48);
      const safeH = Math.max(10, stageSize.height - 48 - bottomSpace);

      const fitted = fitContain(sourceWidth, sourceHeight, safeW, safeH);
      imageFrame = {
        left: Math.max(0, Math.round((stageSize.width - fitted.width) / 2)),
        top: Math.max(20, Math.round((safeH - fitted.height) / 2) + 20),
        width: fitted.width,
        height: fitted.height,
      };

      imageFrameContainer.style.left = imageFrame.left + 'px';
      imageFrameContainer.style.top = imageFrame.top + 'px';
      imageFrameContainer.style.width = imageFrame.width + 'px';
      imageFrameContainer.style.height = imageFrame.height + 'px';

      const dpr = window.devicePixelRatio || 1;
      stageCanvas.width = Math.round(stageSize.width * dpr);
      stageCanvas.height = Math.round(stageSize.height * dpr);
      sCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      updateTextDraftPosition();
      render();
    }

    window.addEventListener('resize', measureStage);

    // 模式切换
    function setAppMode(mode) {
      appMode = mode;
      const activeId = 'tab-btn-' + (mode === 'region_edit' ? 'region' : mode);
      document.querySelectorAll('.tab-btn').forEach(btn => btn.setAttribute('aria-pressed', String(btn.id === activeId)));

      document.getElementById('session-title').textContent = 
        mode === 'view' ? '查看图片' : (mode === 'tools' ? '图片处理' : (mode === 'annotate' ? '自由批注' : '局部重绘'));

      if (mode === 'region_edit' || mode === 'annotate') {
        regionComposer.style.display = 'flex';
        toolsPanel.style.display = 'none';
        stageCanvas.style.display = 'block';
      } else if (mode === 'tools') {
        regionComposer.style.display = 'none';
        toolsPanel.style.display = 'flex';
        stageCanvas.style.display = 'none';
        closeTextDraft(false);
      } else { // 'view'
        regionComposer.style.display = 'none';
        toolsPanel.style.display = 'none';
        stageCanvas.style.display = 'none';
        closeTextDraft(false);
      }
      measureStage();
    }

    let currentBrushRadius = 24;
    function setBrushRadius(r, btn) {
      currentBrushRadius = r;
      document.querySelectorAll('#brush-size-controls > button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    }

    // 切换批注工具
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.composer-tools .tool-btn').forEach(btn => btn.setAttribute('aria-pressed', String(btn.id === 'tool-' + tool)));

      const brushControls = document.getElementById('brush-size-controls');
      if (brushControls) {
        brushControls.style.display = (tool === 'brush') ? 'inline-flex' : 'none';
      }

      stageCanvas.className = 'tool-' + tool;
      render();
    }

    // 坐标换算函数
    function readStagePoint(e) {
      const rect = stageCanvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return null;
      return {
        x: clamp((e.clientX - rect.left) / rect.width, 0, 1),
        y: clamp((e.clientY - rect.top) / rect.height, 0, 1),
      };
    }

    function readImagePointFromStage(e) {
      const rect = stageCanvas.getBoundingClientRect();
      const stageX = e.clientX - rect.left;
      const stageY = e.clientY - rect.top;
      if (
        stageX < imageFrame.left ||
        stageX > imageFrame.left + imageFrame.width ||
        stageY < imageFrame.top ||
        stageY > imageFrame.top + imageFrame.height
      ) {
        return null;
      }
      return {
        x: ((stageX - imageFrame.left) / imageFrame.width) * sourceWidth,
        y: ((stageY - imageFrame.top) / imageFrame.height) * sourceHeight,
      };
    }

    function readClampedImagePointFromStage(e) {
      const rect = stageCanvas.getBoundingClientRect();
      const stageX = clamp(e.clientX - rect.left, imageFrame.left, imageFrame.left + imageFrame.width);
      const stageY = clamp(e.clientY - rect.top, imageFrame.top, imageFrame.top + imageFrame.height);
      return {
        x: ((stageX - imageFrame.left) / imageFrame.width) * sourceWidth,
        y: ((stageY - imageFrame.top) / imageFrame.height) * sourceHeight,
      };
    }

    function imagePointToStagePoint(point) {
      if (!sourceWidth || !sourceHeight || !stageSize.width || !stageSize.height) return { x: 0, y: 0 };
      return {
        x: clamp((imageFrame.left + point.x * (imageFrame.width / sourceWidth)) / stageSize.width, 0, 1),
        y: clamp((imageFrame.top + point.y * (imageFrame.height / sourceHeight)) / stageSize.height, 0, 1),
      };
    }

    function stagePointToImagePoint(point) {
      const stageX = point.x * stageSize.width;
      const stageY = point.y * stageSize.height;
      if (
        stageX < imageFrame.left ||
        stageX > imageFrame.left + imageFrame.width ||
        stageY < imageFrame.top ||
        stageY > imageFrame.top + imageFrame.height
      ) {
        return null;
      }
      return {
        x: ((stageX - imageFrame.left) / imageFrame.width) * sourceWidth,
        y: ((stageY - imageFrame.top) / imageFrame.height) * sourceHeight,
      };
    }

    function pointToSegmentDist(point, start, end) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      if (!dx && !dy) return distance(point, start);
      const ratio = clamp(((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy), 0, 1);
      return distance(point, { x: start.x + ratio * dx, y: start.y + ratio * dy });
    }

    function pointInPolygon(point, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const p1 = polygon[i];
        const p2 = polygon[j];
        if (!p1 || !p2) continue;
        const intersect = ((p1.y > point.y) !== (p2.y > point.y)) &&
          (point.x < ((p2.x - p1.x) * (point.y - p1.y)) / (p2.y - p1.y || 1e-6) + p1.x);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function markAtStagePoint(point) {
      const stageP = { x: point.x * stageSize.width, y: point.y * stageSize.height };
      const imgP = stagePointToImagePoint(point);

      for (let i = marks.length - 1; i >= 0; i--) {
        const mark = marks[i];
        // 1. 检查文字热区
        const textX = mark.textX * stageSize.width;
        const textY = mark.textY * stageSize.height;
        const textW = Math.max(40, (mark.instruction || '').length * mark.fontSize * 0.7 + 10);
        if (
          stageP.x >= textX - 8 && stageP.x <= textX + textW + 8 &&
          stageP.y >= textY - 8 && stageP.y <= textY + mark.fontSize * 1.8 + 8
        ) {
          return mark;
        }

        // 2. 检查几何图形热区
        const shape = mark.shape;
        if (shape.kind === 'arrow') {
          const s = { x: shape.start.x * stageSize.width, y: shape.start.y * stageSize.height };
          const e = { x: shape.end.x * stageSize.width, y: shape.end.y * stageSize.height };
          if (pointToSegmentDist(stageP, s, e) <= 14) return mark;
        } else if (imgP) {
          if (shape.kind === 'rectangle') {
            const minX = Math.min(shape.start.x, shape.end.x);
            const maxX = Math.max(shape.start.x, shape.end.x);
            const minY = Math.min(shape.start.y, shape.end.y);
            const maxY = Math.max(shape.start.y, shape.end.y);
            if (imgP.x >= minX && imgP.x <= maxX && imgP.y >= minY && imgP.y <= maxY) return mark;
          } else if (shape.kind === 'lasso') {
            if (pointInPolygon(imgP, shape.points)) return mark;
          }
        }
      }
      return null;
    }

    // 浮动输入框控制（核心重点）
    function openTextDraft(mark, mode = 'create') {
      textDraft = {
        mark,
        mode,
        x: mark.textX,
        y: mark.textY,
        value: mark.instruction || '',
      };
      textDraftInput.value = textDraft.value;
      updateTextDraftPosition();
      textDraftForm.style.display = 'flex';
      setTimeout(() => textDraftInput.focus(), 20);
      render();
    }

    function updateTextDraftPosition() {
      if (!textDraft || !stageSize.width || !stageSize.height) return;
      const rawLeft = textDraft.x * stageSize.width + TEXT_DRAFT_OFFSET_X;
      const rawTop = textDraft.y * stageSize.height + TEXT_DRAFT_OFFSET_Y;

      const left = clamp(rawLeft, TEXT_DRAFT_EDGE_MARGIN, Math.max(TEXT_DRAFT_EDGE_MARGIN, stageSize.width - TEXT_DRAFT_WIDTH - TEXT_DRAFT_EDGE_MARGIN));
      const top = clamp(rawTop, TEXT_DRAFT_EDGE_MARGIN, Math.max(TEXT_DRAFT_EDGE_MARGIN, stageSize.height - TEXT_DRAFT_HEIGHT - TEXT_DRAFT_EDGE_MARGIN));

      textDraftForm.style.left = left + 'px';
      textDraftForm.style.top = top + 'px';
    }

    function commitTextDraft() {
      if (!textDraft) return;
      const val = textDraftInput.value.trim();
      if (textDraft.mode === 'create') {
        textDraft.mark.instruction = val;
        marks.push(textDraft.mark);
      } else {
        textDraft.mark.instruction = val;
      }
      closeTextDraft(false);
      render();
    }

    function closeTextDraft(commitIfNonEmpty = true) {
      if (!textDraft) return;
      if (commitIfNonEmpty && textDraftInput.value.trim()) {
        commitTextDraft();
        return;
      }
      textDraft = null;
      textDraftForm.style.display = 'none';
      textDraftInput.value = '';
      render();
    }

    textDraftForm.onsubmit = (e) => {
      e.preventDefault();
      commitTextDraft();
    };

    document.getElementById('text-draft-cancel-btn').onclick = (e) => {
      e.stopPropagation();
      closeTextDraft(false);
    };

    // 监听按键与点击外部
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (textDraft) {
        closeTextDraft(false);
        return;
      }
      document.getElementById('cancel-btn').click();
    });

    document.addEventListener('pointerdown', (e) => {
      if (!textDraft) return;
      if (!textDraftForm.contains(e.target) && e.target !== stageCanvas) {
        commitTextDraft();
      }
    });

    // 交互绘制事件
    stageCanvas.onpointerdown = (e) => {
      if (appMode !== 'region_edit') return;
      if (textDraft) {
        commitTextDraft();
        return;
      }

      isPointerDown = true;
      if (typeof stageCanvas.setPointerCapture === 'function') {
        stageCanvas.setPointerCapture(e.pointerId);
      }

      if (currentTool === 'edit' || currentTool === 'delete') {
        const p = readStagePoint(e);
        if (!p) return;
        const mark = markAtStagePoint(p);
        if (mark) {
          if (currentTool === 'delete') {
            marks = marks.filter(m => m.id !== mark.id);
            hoveredMarkId = null;
            render();
          } else {
            openTextDraft(mark, 'edit');
          }
        }
        isPointerDown = false;
        return;
      }

      if (currentTool === 'brush') {
        const imgP = readClampedImagePointFromStage(e);
        if (!imgP) return;
        draft = { kind: 'brush', points: [imgP], radius: currentBrushRadius };
        render();
        return;
      }

      if (currentTool === 'annotation') {
        const p = readStagePoint(e);
        if (!p) return;
        draft = {
          kind: 'arrow',
          color: ANNOTATION_COLOR,
          start: p,
          end: p,
        };
        render();
        return;
      }

      const imgP = readImagePointFromStage(e);
      if (!imgP) return;

      if (currentTool === 'rectangle') {
        draft = { kind: 'rectangle', start: imgP, end: imgP };
      } else if (currentTool === 'lasso') {
        draft = { kind: 'lasso', points: [imgP] };
      }
      render();
    };

    stageCanvas.onpointermove = (e) => {
      if (appMode !== 'region_edit') return;

      if (!isPointerDown || !draft) {
        if (currentTool === 'edit' || currentTool === 'delete') {
          const p = readStagePoint(e);
          const mark = p ? markAtStagePoint(p) : null;
          const newHover = mark ? mark.id : null;
          if (newHover !== hoveredMarkId) {
            hoveredMarkId = newHover;
            render();
          }
        }
        return;
      }

      if (draft.kind === 'brush') {
        const imgP = readClampedImagePointFromStage(e);
        if (imgP) {
          draft.points.push(imgP);
          render();
        }
        return;
      }

      if (draft.kind === 'arrow') {
        const p = readStagePoint(e);
        if (p) {
          draft.end = p;
          render();
        }
        return;
      }

      if (draft.kind === 'rectangle') {
        const imgP = readImagePointFromStage(e);
        if (imgP) {
          draft.end = imgP;
          render();
        }
        return;
      }

      if (draft.kind === 'lasso') {
        const imgP = readClampedImagePointFromStage(e);
        if (imgP) {
          const last = draft.points[draft.points.length - 1];
          const scaleX = imageFrame.width / sourceWidth;
          const scaleY = imageFrame.height / sourceHeight;
          if (!last || Math.hypot((imgP.x - last.x) * scaleX, (imgP.y - last.y) * scaleY) >= LASSO_MIN_SCREEN_DISTANCE) {
            draft.points.push(imgP);
            render();
          }
        }
      }
    };

    stageCanvas.onpointerup = (e) => {
      if (!isPointerDown || !draft) return;
      isPointerDown = false;
      if (typeof stageCanvas.releasePointerCapture === 'function' && stageCanvas.hasPointerCapture(e.pointerId)) {
        stageCanvas.releasePointerCapture(e.pointerId);
      }

      const finishedDraft = draft;
      draft = null;

      // 0. 涂鸦完成
      if (finishedDraft.kind === 'brush') {
        if (finishedDraft.points.length > 0) {
          const id = createElementId();
          const mark = {
            id,
            color: ANNOTATION_COLOR,
            fontSize: ANNOTATION_FONT_SIZE,
            instruction: '',
            shape: { id, kind: 'brush', points: finishedDraft.points, radius: finishedDraft.radius || 24 },
            textX: 0,
            textY: 0,
          };
          marks.push(mark);
        }
      }
      // 1. 指向完成
      else if (finishedDraft.kind === 'arrow') {
        const dist = distance(
          { x: finishedDraft.start.x * stageSize.width, y: finishedDraft.start.y * stageSize.height },
          { x: finishedDraft.end.x * stageSize.width, y: finishedDraft.end.y * stageSize.height }
        );
        if (dist >= ANNOTATION_MIN_LENGTH) {
          const id = createElementId();
          const mark = {
            id,
            color: ANNOTATION_COLOR,
            fontSize: ANNOTATION_FONT_SIZE,
            instruction: '',
            shape: { id, kind: 'arrow', color: ANNOTATION_COLOR, start: finishedDraft.start, end: finishedDraft.end },
            textX: finishedDraft.start.x,
            textY: finishedDraft.start.y,
          };
          openTextDraft(mark, 'create');
        }
      }
      // 2. 框选完成
      else if (finishedDraft.kind === 'rectangle') {
        if (distance(finishedDraft.start, finishedDraft.end) >= 4) {
          const id = createElementId();
          const anchor = imagePointToStagePoint(finishedDraft.start);
          const mark = {
            id,
            color: ANNOTATION_COLOR,
            fontSize: ANNOTATION_FONT_SIZE,
            instruction: '',
            shape: { id, kind: 'rectangle', start: finishedDraft.start, end: finishedDraft.end },
            textX: anchor.x,
            textY: anchor.y,
          };
          openTextDraft(mark, 'create');
        }
      }
      // 3. 圈选完成
      else if (finishedDraft.kind === 'lasso') {
        if (finishedDraft.points.length >= LASSO_MIN_POINTS) {
          const id = createElementId();
          const anchorPt = finishedDraft.points[finishedDraft.points.length - 1] || finishedDraft.points[0];
          const anchor = imagePointToStagePoint(anchorPt);
          const mark = {
            id,
            color: ANNOTATION_COLOR,
            fontSize: ANNOTATION_FONT_SIZE,
            instruction: '',
            shape: { id, kind: 'lasso', points: finishedDraft.points },
            textX: anchor.x,
            textY: anchor.y,
          };
          openTextDraft(mark, 'create');
        }
      }
      render();
    };

    // 双击任意标记唤起编辑
    stageCanvas.ondblclick = (e) => {
      const p = readStagePoint(e);
      if (!p) return;
      const mark = markAtStagePoint(p);
      if (mark) {
        openTextDraft(mark, 'edit');
      }
    };

    function clearMarks() {
      marks = [];
      closeTextDraft(false);
      render();
    }

    // Canvas 渲染引擎
    function getCurveControlPoint(start, end, scaleX, scaleY) {
      const startX = start.x * scaleX;
      const startY = start.y * scaleY;
      const endX = end.x * scaleX;
      const endY = end.y * scaleY;
      const dx = endX - startX;
      const dy = endY - startY;
      const length = Math.hypot(dx, dy);
      if (length === 0) return { x: startX, y: startY };
      const bend = clamp(length * 0.12, 16, 48);
      const direction = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? -1 : 1) : 1;
      return {
        x: (startX + endX) / 2 + (-dy / length) * bend * direction,
        y: (startY + endY) / 2 + (dx / length) * bend * direction,
      };
    }

    function drawCurvedArrow(ctx, start, end, scaleX, scaleY, options = {}) {
      const startX = start.x * scaleX;
      const startY = start.y * scaleY;
      const endX = end.x * scaleX;
      const endY = end.y * scaleY;
      const control = getCurveControlPoint(start, end, scaleX, scaleY);
      const angle = Math.atan2(endY - control.y, endX - control.x);
      const headLength = 10;
      const headAngle = Math.PI / 7;

      ctx.save();
      ctx.strokeStyle = options.color || ANNOTATION_COLOR;
      ctx.lineWidth = options.width || ANNOTATION_LINE_WIDTH;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(control.x, control.y, endX, endY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - headLength * Math.cos(angle - headAngle), endY - headLength * Math.sin(angle - headAngle));
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - headLength * Math.cos(angle + headAngle), endY - headLength * Math.sin(angle + headAngle));
      ctx.stroke();
      ctx.restore();
    }

    function drawMaskShape(ctx, shape, fillAlpha, isHovered = false) {
      const scaleX = imageFrame.width / sourceWidth;
      const scaleY = imageFrame.height / sourceHeight;
      const offX = imageFrame.left;
      const offY = imageFrame.top;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = isHovered ? MASK_STROKE_WIDTH + 1 : MASK_STROKE_WIDTH;
      ctx.strokeStyle = ANNOTATION_COLOR;
      ctx.fillStyle = ANNOTATION_COLOR;
      ctx.globalAlpha = fillAlpha;
      ctx.beginPath();

      if (shape.kind === 'rectangle') {
        const x = offX + Math.min(shape.start.x, shape.end.x) * scaleX;
        const y = offY + Math.min(shape.start.y, shape.end.y) * scaleY;
        const w = Math.abs(shape.end.x - shape.start.x) * scaleX;
        const h = Math.abs(shape.end.y - shape.start.y) * scaleY;
        ctx.rect(x, y, w, h);
      } else if (shape.kind === 'lasso') {
        const pts = shape.points;
        if (pts.length > 0) {
          ctx.moveTo(offX + pts[0].x * scaleX, offY + pts[0].y * scaleY);
          for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(offX + pts[i].x * scaleX, offY + pts[i].y * scaleY);
          }
          ctx.closePath();
        }
      } else if (shape.kind === 'brush') {
        const pts = shape.points;
        const radius = (shape.radius || 24) * scaleX;
        if (pts.length > 0) {
          ctx.lineWidth = radius * 2;
          ctx.beginPath();
          ctx.moveTo(offX + pts[0].x * scaleX, offY + pts[0].y * scaleY);
          for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(offX + pts[i].x * scaleX, offY + pts[i].y * scaleY);
          }
          ctx.stroke();
          if (pts.length === 1) {
            ctx.beginPath();
            ctx.arc(offX + pts[0].x * scaleX, offY + pts[0].y * scaleY, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      ctx.fill();
      ctx.globalAlpha = 0.92;
      ctx.stroke();
      ctx.restore();
    }

    function drawMarkInstruction(ctx, mark) {
      if (!mark.instruction) return;
      const x = mark.textX * stageSize.width;
      const y = mark.textY * stageSize.height;

      ctx.save();
      ctx.font = `600 ${mark.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textBaseline = 'top';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 4;
      ctx.strokeText(mark.instruction, x, y);
      ctx.fillStyle = mark.color;
      ctx.fillText(mark.instruction, x, y);
      ctx.restore();
    }

    function render() {
      if (!stageSize.width || !stageSize.height) return;
      sCtx.clearRect(0, 0, stageSize.width, stageSize.height);

      const allMarks = [...marks];
      if (textDraft && textDraft.mode === 'create') {
        allMarks.push(textDraft.mark);
      }

      // 1. 渲染选区遮罩
      for (const mark of allMarks) {
        if (mark.shape.kind === 'rectangle' || mark.shape.kind === 'lasso' || mark.shape.kind === 'brush') {
          drawMaskShape(sCtx, mark.shape, mark.id === hoveredMarkId ? 0.38 : 0.28, mark.id === hoveredMarkId);
        }
      }

      // 2. 渲染正在拖动的 Draft
      if (draft) {
        if (draft.kind === 'rectangle' || draft.kind === 'lasso' || draft.kind === 'brush') {
          drawMaskShape(sCtx, draft, 0.32, false);
        } else if (draft.kind === 'arrow') {
          drawCurvedArrow(sCtx, draft.start, draft.end, stageSize.width, stageSize.height, {
            color: draft.color,
            width: ANNOTATION_LINE_WIDTH,
          });
        }
      }

      // 3. 渲染箭头和文字说明
      for (const mark of allMarks) {
        if (mark.shape.kind === 'arrow') {
          drawCurvedArrow(sCtx, mark.shape.start, mark.shape.end, stageSize.width, stageSize.height, {
            color: mark.color,
            width: mark.id === hoveredMarkId ? ANNOTATION_LINE_WIDTH * 1.6 : ANNOTATION_LINE_WIDTH,
          });
        }
        drawMarkInstruction(sCtx, mark);
      }
    }

    // 导出 Mask 与 Preview (遵循 image-flow 规范：不透明黑色区域保留，透明区域重绘)
    function exportMaskDataUrl() {
      const mCanvas = document.createElement('canvas');
      mCanvas.width = sourceWidth;
      mCanvas.height = sourceHeight;
      const mCtx = mCanvas.getContext('2d');

      mCtx.clearRect(0, 0, sourceWidth, sourceHeight);
      mCtx.fillStyle = '#000000';
      mCtx.fillRect(0, 0, sourceWidth, sourceHeight);

      mCtx.save();
      mCtx.globalCompositeOperation = 'destination-out';
      mCtx.fillStyle = '#000000';

      marks.forEach(mark => {
        const shape = mark.shape;
        if (shape.kind === 'rectangle') {
          const x = Math.min(shape.start.x, shape.end.x);
          const y = Math.min(shape.start.y, shape.end.y);
          const w = Math.abs(shape.end.x - shape.start.x);
          const h = Math.abs(shape.end.y - shape.start.y);
          mCtx.fillRect(x, y, w, h);
        } else if (shape.kind === 'lasso') {
          const pts = shape.points;
          if (pts.length > 0) {
            mCtx.beginPath();
            mCtx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) mCtx.lineTo(pts[i].x, pts[i].y);
            mCtx.closePath();
            mCtx.fill();
          }
        } else if (shape.kind === 'brush') {
          const pts = shape.points;
          const radius = shape.radius || 24;
          if (pts.length > 0) {
            mCtx.lineWidth = radius * 2;
            mCtx.lineCap = 'round';
            mCtx.lineJoin = 'round';
            mCtx.beginPath();
            mCtx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) mCtx.lineTo(pts[i].x, pts[i].y);
            mCtx.stroke();
            if (pts.length === 1) {
              mCtx.beginPath();
              mCtx.arc(pts[0].x, pts[0].y, radius, 0, Math.PI * 2);
              mCtx.fill();
            }
          }
        } else if (shape.kind === 'arrow') {
          // 箭头指向位置生成对应目标 Mask
          const target = stagePointToImagePoint(shape.end);
          if (target) {
            const size = Math.max(ARROW_TARGET_MASK_MIN_SIZE, Math.min(sourceWidth, sourceHeight) * ARROW_TARGET_MASK_RATIO);
            const half = size / 2;
            mCtx.fillRect(
              clamp(target.x - half, 0, sourceWidth),
              clamp(target.y - half, 0, sourceHeight),
              size,
              size
            );
          }
        }
      });
      mCtx.restore();
      return mCanvas.toDataURL('image/png');
    }

    function exportPreviewDataUrl() {
      return exportCompositeSourceDataUrl();
    }

    function exportCompositeSourceDataUrl() {
      const cCanvas = document.createElement('canvas');
      cCanvas.width = sourceWidth;
      cCanvas.height = sourceHeight;
      const ctx = cCanvas.getContext('2d');

      // 1. 绘制底层图片
      ctx.drawImage(currentImageCanvas, 0, 0, sourceWidth, sourceHeight);

      const fontScale = Math.max(1, sourceWidth / (stageSize.width || sourceWidth));

      // 2. 绘制选区遮罩
      for (const mark of marks) {
        const shape = mark.shape;
        if (shape.kind === 'rectangle') {
          const x = Math.min(shape.start.x, shape.end.x);
          const y = Math.min(shape.start.y, shape.end.y);
          const w = Math.abs(shape.end.x - shape.start.x);
          const h = Math.abs(shape.end.y - shape.start.y);
          ctx.save();
          ctx.fillStyle = ANNOTATION_COLOR;
          ctx.globalAlpha = 0.22;
          ctx.fillRect(x, y, w, h);
          ctx.globalAlpha = 0.92;
          ctx.strokeStyle = ANNOTATION_COLOR;
          ctx.lineWidth = Math.max(2, 2 * fontScale);
          ctx.strokeRect(x, y, w, h);
          ctx.restore();
        } else if (shape.kind === 'lasso') {
          const pts = shape.points;
          if (pts.length > 0) {
            ctx.save();
            ctx.fillStyle = ANNOTATION_COLOR;
            ctx.strokeStyle = ANNOTATION_COLOR;
            ctx.lineWidth = Math.max(2, 2 * fontScale);
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.globalAlpha = 0.22;
            ctx.fill();
            ctx.globalAlpha = 0.92;
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // 3. 绘制弯曲箭头与文字说明
      for (const mark of marks) {
        if (mark.shape.kind === 'arrow') {
          const s = stagePointToImagePoint(mark.shape.start) || { x: mark.shape.start.x * sourceWidth, y: mark.shape.start.y * sourceHeight };
          const e = stagePointToImagePoint(mark.shape.end) || { x: mark.shape.end.x * sourceWidth, y: mark.shape.end.y * sourceHeight };
          drawCurvedArrow(ctx, 
            { x: s.x / sourceWidth, y: s.y / sourceHeight }, 
            { x: e.x / sourceWidth, y: e.y / sourceHeight }, 
            sourceWidth, sourceHeight, {
              color: mark.color,
              width: Math.max(2, ANNOTATION_LINE_WIDTH * fontScale),
            }
          );
        }

        if (mark.instruction) {
          const textPos = stagePointToImagePoint({ x: mark.textX, y: mark.textY }) || { x: mark.textX * sourceWidth, y: mark.textY * sourceHeight };
          const fontSize = Math.round(mark.fontSize * fontScale);
          ctx.save();
          ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
          ctx.textBaseline = 'top';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = Math.max(3, 4 * fontScale);
          ctx.strokeText(mark.instruction, textPos.x, textPos.y);
          ctx.fillStyle = mark.color || ANNOTATION_COLOR;
          ctx.fillText(mark.instruction, textPos.x, textPos.y);
          ctx.restore();
        }
      }

      return cCanvas.toDataURL('image/png');
    }

    // 提交局部重绘
    async function handleSubmit() {
      if (textDraft) commitTextDraft();
      document.getElementById('loading-overlay').classList.add('open');
      document.getElementById('loading-text').textContent = '正在重绘…';

      try {
        const sourceDataUrl = currentImageCanvas.toDataURL('image/png');
        const compositeDataUrl = exportCompositeSourceDataUrl();
        const maskDataUrl = exportMaskDataUrl();

        const payload = {
          mode: appMode,
          ...(paramSourcePath ? { source_path: paramSourcePath } : {}),
          ...(isEmbedded ? { keep_alive: true } : {}),
          source_data: sourceDataUrl,
          image_data: compositeDataUrl,
          mask: maskDataUrl,
          annotation_preview: compositeDataUrl,
          annotations: marks.map(m => ({
            id: m.id,
            type: m.shape.kind,
            instruction: m.instruction,
          })),
          prompt: document.getElementById('region-prompt').value.trim(),
          model: document.getElementById('model-select').value,
        };

        // 局部重绘是云端任务：先报价，用户确认积分消耗后才提交
        const { res, data: result } = await window.plPostWithChargeConsent('/api/submit', payload, {
          'Content-Type': 'application/json',
          'X-Asx-Session-Token': token,
        });
        const taskRes = result.result || {};
        if (!res.ok || !result.ok || taskRes.ok === false) {
          const errMsg = result.error?.message || taskRes.error?.message || '提交失败';
          throw new Error(errMsg);
        }

        const outFiles = taskRes.files || (taskRes.image && taskRes.image.path ? [taskRes.image.path] : []);
        const outPath = outFiles[0] || '';
        document.getElementById('loading-text').innerHTML = outPath
          ? `重绘完成，图片已保存到：<br><code class="pl-code">${escapeHtml(outPath)}</code>`
          : '重绘完成，正在返回…';
        if (isEmbedded && window.parent !== window) {
          window.parent.postMessage({ type: 'asx-workbench-complete', result: taskRes }, '*');
          return;
        }
        if (outPath) {
          clearMarks();
          sourceImageView.src = '/api/result?token=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(outPath);
          setAppMode('view');
          setTimeout(() => {
            document.getElementById('loading-overlay').classList.remove('open');
          }, 1500);
        } else {
          setTimeout(() => window.close(), 1200);
        }
      } catch (err) {
        document.getElementById('loading-overlay').classList.remove('open');
        plToast('提交失败：' + err.message, 'err', 6000);
      }
    }

    // 图片处理相关 (Tools 模式)
    function applyRecipe(recipe) {
      const ctx = currentImageCanvas.getContext('2d');
      if (recipe === 'trim_transparent') {
        const imgData = ctx.getImageData(0, 0, sourceWidth, sourceHeight);
        let minX = sourceWidth, minY = sourceHeight, maxX = 0, maxY = 0;
        for (let y = 0; y < sourceHeight; y++) {
          for (let x = 0; x < sourceWidth; x++) {
            const a = imgData.data[(y * sourceWidth + x) * 4 + 3];
            if (a > 10) {
              minX = Math.min(minX, x); minY = Math.min(minY, y);
              maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
            }
          }
        }
        if (maxX >= minX && maxY >= minY) {
          const w = maxX - minX + 1, h = maxY - minY + 1;
          const trimmed = ctx.getImageData(minX, minY, w, h);
          currentImageCanvas.width = w; currentImageCanvas.height = h;
          sourceWidth = w; sourceHeight = h;
          currentImageCanvas.getContext('2d').putImageData(trimmed, 0, 0);
        }
      } else if (recipe === 'remove_background') {
        const imgData = ctx.getImageData(0, 0, sourceWidth, sourceHeight);
        const bgR = imgData.data[0], bgG = imgData.data[1], bgB = imgData.data[2];
        for (let i = 0; i < imgData.data.length; i += 4) {
          const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
          if (Math.hypot(r - bgR, g - bgG, b - bgB) < 40) imgData.data[i+3] = 0;
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (recipe === 'inventory_icon') {
        applyRecipe('trim_transparent');
        applyResize(64, 64);
        return;
      }
      sourceImageView.src = currentImageCanvas.toDataURL('image/png');
      document.getElementById('image-dimensions').textContent = `${sourceWidth} × ${sourceHeight}`;
      measureStage();
    }

    function applyResize(targetW, targetH) {
      const tw = targetW || parseInt(document.getElementById('resize-w').value) || sourceWidth;
      const th = targetH || parseInt(document.getElementById('resize-h').value) || sourceHeight;
      const temp = document.createElement('canvas');
      temp.width = tw; temp.height = th;
      temp.getContext('2d').drawImage(currentImageCanvas, 0, 0, tw, th);

      currentImageCanvas.width = tw;
      currentImageCanvas.height = th;
      sourceWidth = tw;
      sourceHeight = th;
      currentImageCanvas.getContext('2d').drawImage(temp, 0, 0);

      sourceImageView.src = currentImageCanvas.toDataURL('image/png');
      document.getElementById('image-dimensions').textContent = `${sourceWidth} × ${sourceHeight}`;
      measureStage();
    }

    function resetToOriginal() {
      sourceWidth = sourceImage.naturalWidth;
      sourceHeight = sourceImage.naturalHeight;
      currentImageCanvas.width = sourceWidth;
      currentImageCanvas.height = sourceHeight;
      currentImageCanvas.getContext('2d').drawImage(sourceImage, 0, 0);
      sourceImageView.src = currentImageCanvas.toDataURL('image/png');
      document.getElementById('image-dimensions').textContent = `${sourceWidth} × ${sourceHeight}`;
      measureStage();
    }

    async function submitToolImage() {
      document.getElementById('loading-overlay').classList.add('open');
      document.getElementById('loading-text').textContent = '正在保存修改…';
      try {
        const payload = {
          mode: 'tools',
          ...(paramSourcePath ? { source_path: paramSourcePath } : {}),
          image_data: currentImageCanvas.toDataURL('image/png'),
          recipe: 'custom',
          keep_alive: true,
        };
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Asx-Session-Token': token,
          },
          body: JSON.stringify(payload),
        });
        const result = await res.json();
        if (!res.ok || !result.ok) throw new Error(result.error?.message || '保存失败');
        
        const savedPath = result.result?.image?.path || (result.result?.files && result.result.files[0]) || '';
        if (isEmbedded && window.parent !== window) {
          window.parent.postMessage({ type: 'asx-workbench-complete', result: result.result }, '*');
          return;
        }
        document.getElementById('loading-text').innerHTML = savedPath
          ? `修改已保存到：<br><code class="pl-code">${escapeHtml(savedPath)}</code>`
          : '修改已保存';

        // 同步将底图更新为当前已编辑图像，方便后续继续微调或局部重绘
        sourceImage.src = currentImageCanvas.toDataURL('image/png');
        sourceImageView.src = sourceImage.src;

        setTimeout(() => {
          document.getElementById('loading-overlay').classList.remove('open');
        }, 1200);
      } catch (err) {
        document.getElementById('loading-overlay').classList.remove('open');
        plToast('保存失败：' + err.message, 'err', 6000);
      }
    }

    const finishBtn = document.getElementById('finish-btn');
    if (finishBtn) {
      finishBtn.onclick = async () => {
        document.getElementById('loading-overlay').classList.add('open');
        document.getElementById('loading-text').textContent = '正在保存并完成…';
        try {
          const payload = {
            mode: 'tools',
            ...(paramSourcePath ? { source_path: paramSourcePath } : {}),
            image_data: currentImageCanvas.toDataURL('image/png'),
            recipe: 'custom',
            keep_alive: isEmbedded ? true : false,
          };
          const res = await fetch('/api/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Asx-Session-Token': token,
            },
            body: JSON.stringify(payload),
          });
          const result = await res.json();
          if (!res.ok || !result.ok) throw new Error(result.error?.message || '保存失败');
          if (isEmbedded && window.parent !== window) {
            document.getElementById('loading-overlay').classList.remove('open');
            window.parent.postMessage({ type: 'asx-workbench-complete', result: result.result }, '*');
            return;
          }
          setTimeout(() => window.close(), 600);
        } catch (err) {
          document.getElementById('loading-overlay').classList.remove('open');
          plToast('保存失败：' + err.message, 'err', 6000);
        }
      };
    }

    document.getElementById('cancel-btn').onclick = async () => {
      if (isEmbedded && window.parent !== window) {
        window.parent.postMessage({ type: 'asx-workbench-cancel' }, '*');
        return;
      }
      try {
        await fetch('/api/cancel', {
          method: 'POST',
          headers: { 'X-Asx-Session-Token': token },
        });
      } finally {
        window.close();
      }
    };

    // 启动
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
