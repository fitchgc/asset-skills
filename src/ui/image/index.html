<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asynx Local UI Workbench</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .title-group { display: flex; align-items: center; gap: 12px; }
    .badge { background: #27272a; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .actions { display: flex; gap: 8px; }
    button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { background: #27272a; }
    button.primary { background: var(--primary); border-color: var(--primary); color: white; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { background: transparent; border-color: var(--border); color: var(--danger); }
    button.active { background: #3b82f633; border-color: var(--primary); color: var(--primary); }
    main { flex: 1; display: flex; overflow: hidden; }
    #canvas-container { flex: 1; position: relative; background: #000000; display: flex; align-items: center; justify-content: center; overflow: auto; background-image: radial-gradient(#27272a 1px, transparent 1px); background-size: 16px 16px; }
    canvas { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #sidebar { width: 340px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .panel-section { padding: 16px; border-bottom: 1px solid var(--border); }
    .panel-section h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
    .tool-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    input, select, textarea { width: 100%; background: #09090b; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }
    .annotation-item { background: #09090b; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
    .annotation-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: var(--text-muted); }
    #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #27272a; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h2 style="font-size: 16px; font-weight: 600;">Asynx Local UI Workbench</h2>
      <span class="badge" id="mode-badge">Loading</span>
    </div>
    <div class="actions">
      <button class="danger" id="cancel-btn">Cancel</button>
      <button class="primary" id="submit-btn">Submit</button>
    </div>
  </header>

  <main>
    <div id="canvas-container">
      <div id="canvas-wrapper" style="position: relative;">
        <canvas id="source-canvas"></canvas>
        <canvas id="draw-canvas" style="position: absolute; left: 0; top: 0; cursor: crosshair;"></canvas>
      </div>
    </div>

    <div id="sidebar">
      <!-- Injected per mode -->
      <div id="sidebar-content"></div>
    </div>
  </main>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Processing...</p>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token') || window.location.hash.replace('#token=', '');
    let session = null;
    let sourceImage = new Image();
    let currentTool = 'arrow';
    let marks = [];
    let isDrawing = false;
    let startPoint = null;
    let currentLasso = [];

    const sourceCanvas = document.getElementById('source-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const sCtx = sourceCanvas.getContext('2d');
    const dCtx = drawCanvas.getContext('2d');

    async function init() {
      try {
        const res = await fetch('/api/session', { headers: { 'X-Asx-Session-Token': token } });
        if (!res.ok) throw new Error('Unauthorized or session expired');
        session = await res.json();
        document.getElementById('mode-badge').textContent = session.mode;

        sourceImage.crossOrigin = 'anonymous';
        sourceImage.onload = () => {
          sourceCanvas.width = sourceImage.naturalWidth;
          sourceCanvas.height = sourceImage.naturalHeight;
          drawCanvas.width = sourceImage.naturalWidth;
          drawCanvas.height = sourceImage.naturalHeight;
          sCtx.drawImage(sourceImage, 0, 0);
          setupModeUI();
        };
        sourceImage.src = '/api/source?token=' + encodeURIComponent(token);
      } catch (err) {
        alert('Failed to load session: ' + err.message);
      }
    }

    function setupModeUI() {
      const sidebar = document.getElementById('sidebar-content');
      if (session.mode === 'region_edit') {
        sidebar.innerHTML = `
          <div class="panel-section">
            <h3>Annotation Tools</h3>
            <div class="tool-group">
              <button class="active" onclick="setTool('arrow', this)">Arrow</button>
              <button onclick="setTool('rectangle', this)">Rectangle</button>
              <button onclick="setTool('lasso', this)">Lasso</button>
              <button onclick="clearMarks()">Clear</button>
            </div>
          </div>
          <div class="panel-section">
            <h3>Region Instructions</h3>
            <div id="annotations-list">
              <p style="color: var(--text-muted); font-size: 12px;">Draw an arrow, rectangle or lasso on the image to add instructions.</p>
            </div>
          </div>
          <div class="panel-section">
            <h3>Overall Prompt</h3>
            <textarea id="overall-prompt" placeholder="Overall image modification prompt..."></textarea>
            <label>Model</label>
            <select id="model-select">
              ${(session.models || []).map(m => `<option value="${m.name}">${m.name}</option>`).join('')}
            </select>
          </div>
        `;
        setupDrawingListeners();
      } else if (session.mode === 'tools' || session.mode === 'image_tools') {
        document.getElementById('submit-btn').textContent = 'Save Image';
        sidebar.innerHTML = `
          <div class="panel-section">
            <h3>Game Asset Recipes</h3>
            <div class="tool-group" style="flex-direction: column;">
              <button onclick="applyRecipe('inventory_icon')">Inventory Icon (64x64 trim + pad)</button>
              <button onclick="applyRecipe('remove_background')">Remove Background</button>
              <button onclick="applyRecipe('trim_transparent')">Trim Transparent Border</button>
              <button onclick="applyRecipe('normalize_alpha')">Normalize Transparent Asset</button>
              <button onclick="resetImage()">Reset to Original</button>
            </div>
          </div>
          <div class="panel-section">
            <h3>Adjustments</h3>
            <label>Padding (px)</label>
            <input type="number" id="pad-input" value="0" min="0" max="500" onchange="applyRecipe('pad')">
            <label>Resize Width</label>
            <input type="number" id="resize-w" value="${sourceImage.naturalWidth}">
            <label>Resize Height</label>
            <input type="number" id="resize-h" value="${sourceImage.naturalHeight}">
            <button onclick="applyResize()">Apply Resize</button>
          </div>
        `;
      } else if (session.mode === 'annotate' || session.mode === 'image_annotate') {
        document.getElementById('submit-btn').textContent = 'Save Annotated Image';
        sidebar.innerHTML = `
          <div class="panel-section">
            <h3>Drawing Tools</h3>
            <div class="tool-group">
              <button class="active" onclick="setTool('brush', this)">Brush</button>
              <button onclick="setTool('eraser', this)">Eraser</button>
              <button onclick="setTool('arrow', this)">Arrow</button>
              <button onclick="setTool('rectangle', this)">Rectangle</button>
            </div>
            <label>Color</label>
            <input type="color" id="draw-color" value="#ef4444">
            <label>Line Width</label>
            <input type="range" id="draw-width" min="1" max="30" value="4">
          </div>
        `;
        setupDrawingListeners();
      }
    }

    function setTool(tool, btn) {
      currentTool = tool;
      document.querySelectorAll('.tool-group button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function setupDrawingListeners() {
      drawCanvas.onpointerdown = (e) => {
        isDrawing = true;
        const rect = drawCanvas.getBoundingClientRect();
        const scaleX = drawCanvas.width / rect.width;
        const scaleY = drawCanvas.height / rect.height;
        startPoint = { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        if (currentTool === 'lasso') {
          currentLasso = [startPoint];
        }
      };

      drawCanvas.onpointermove = (e) => {
        if (!isDrawing) return;
        const rect = drawCanvas.getBoundingClientRect();
        const scaleX = drawCanvas.width / rect.width;
        const scaleY = drawCanvas.height / rect.height;
        const currentPoint = { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };

        redrawMarks();
        if (currentTool === 'arrow') {
          drawArrow(dCtx, startPoint, currentPoint, '#ef4444');
        } else if (currentTool === 'rectangle') {
          drawRect(dCtx, startPoint, currentPoint, '#ef4444');
        } else if (currentTool === 'lasso') {
          currentLasso.push(currentPoint);
          drawLasso(dCtx, currentLasso, '#ef4444');
        }
      };

      drawCanvas.onpointerup = (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        const rect = drawCanvas.getBoundingClientRect();
        const scaleX = drawCanvas.width / rect.width;
        const scaleY = drawCanvas.height / rect.height;
        const endPoint = { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };

        const id = 'mark_' + Date.now();
        if (currentTool === 'arrow') {
          marks.push({ id, type: 'arrow', start: startPoint, end: endPoint, instruction: '' });
        } else if (currentTool === 'rectangle') {
          marks.push({ id, type: 'rectangle', start: startPoint, end: endPoint, instruction: '' });
        } else if (currentTool === 'lasso' && currentLasso.length > 2) {
          marks.push({ id, type: 'lasso', points: currentLasso, instruction: '' });
        }
        redrawMarks();
        updateAnnotationsList();
      };
    }

    function drawArrow(ctx, from, to, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - 16 * Math.cos(angle - Math.PI / 6), to.y - 16 * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - 16 * Math.cos(angle + Math.PI / 6), to.y - 16 * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRect(ctx, from, to, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(from.x, from.y, to.x - from.x, to.y - from.y);
      ctx.fillStyle = color + '22';
      ctx.fillRect(from.x, from.y, to.x - from.x, to.y - from.y);
      ctx.restore();
    }

    function drawLasso(ctx, points, color) {
      if (points.length < 2) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
      ctx.fillStyle = color + '22';
      ctx.fill();
      ctx.restore();
    }

    function redrawMarks() {
      dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      marks.forEach((m, i) => {
        const color = '#3b82f6';
        if (m.type === 'arrow') drawArrow(dCtx, m.start, m.end, color);
        else if (m.type === 'rectangle') drawRect(dCtx, m.start, m.end, color);
        else if (m.type === 'lasso') drawLasso(dCtx, m.points, color);

        // draw tag
        dCtx.fillStyle = '#18181b';
        dCtx.fillRect((m.start || m.points[0]).x, (m.start || m.points[0]).y - 20, 24, 20);
        dCtx.fillStyle = '#ffffff';
        dCtx.font = 'bold 12px sans-serif';
        dCtx.fillText('#' + (i + 1), (m.start || m.points[0]).x + 4, (m.start || m.points[0]).y - 6);
      });
    }

    function updateAnnotationsList() {
      const container = document.getElementById('annotations-list');
      if (!marks.length) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 12px;">No marks yet.</p>';
        return;
      }
      container.innerHTML = marks.map((m, i) => `
        <div class="annotation-item">
          <div class="annotation-item-header">
            <strong>#${i + 1} (${m.type})</strong>
            <button onclick="removeMark(${i})" style="padding: 2px 6px; font-size: 11px;">Remove</button>
          </div>
          <input type="text" placeholder="Instructions for this region..." value="${m.instruction || ''}" oninput="marks[${i}].instruction = this.value">
        </div>
      `).join('');
    }

    function removeMark(index) {
      marks.splice(index, 1);
      redrawMarks();
      updateAnnotationsList();
    }

    function clearMarks() {
      marks = [];
      redrawMarks();
      updateAnnotationsList();
    }

    function exportMaskDataUrl() {
      const mCanvas = document.createElement('canvas');
      mCanvas.width = sourceCanvas.width;
      mCanvas.height = sourceCanvas.height;
      const mCtx = mCanvas.getContext('2d');
      mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
      mCtx.fillStyle = '#000000';
      mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
      mCtx.fillStyle = '#ffffff';
      marks.forEach(m => {
        if (m.type === 'rectangle') {
          mCtx.fillRect(m.start.x, m.start.y, m.end.x - m.start.x, m.end.y - m.start.y);
        } else if (m.type === 'lasso') {
          mCtx.beginPath();
          mCtx.moveTo(m.points[0].x, m.points[0].y);
          for (let pt of m.points) mCtx.lineTo(pt.x, pt.y);
          mCtx.closePath();
          mCtx.fill();
        } else if (m.type === 'arrow') {
          mCtx.beginPath();
          mCtx.arc(m.end.x, m.end.y, 40, 0, Math.PI * 2);
          mCtx.fill();
        }
      });
      return mCanvas.toDataURL('image/png');
    }

    function exportPreviewDataUrl() {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = sourceCanvas.width;
      pCanvas.height = sourceCanvas.height;
      const pCtx = pCanvas.getContext('2d');
      pCtx.drawImage(sourceCanvas, 0, 0);
      pCtx.drawImage(drawCanvas, 0, 0);
      return pCanvas.toDataURL('image/png');
    }

    // Local tool recipes
    function applyRecipe(recipe) {
      if (recipe === 'trim_transparent') {
        const imgData = sCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
        let minX = sourceCanvas.width, minY = sourceCanvas.height, maxX = 0, maxY = 0;
        for (let y = 0; y < sourceCanvas.height; y++) {
          for (let x = 0; x < sourceCanvas.width; x++) {
            const a = imgData.data[(y * sourceCanvas.width + x) * 4 + 3];
            if (a > 10) {
              minX = Math.min(minX, x); minY = Math.min(minY, y);
              maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
            }
          }
        }
        if (maxX >= minX && maxY >= minY) {
          const w = maxX - minX + 1, h = maxY - minY + 1;
          const trimmed = sCtx.getImageData(minX, minY, w, h);
          sourceCanvas.width = w; sourceCanvas.height = h;
          drawCanvas.width = w; drawCanvas.height = h;
          sCtx.putImageData(trimmed, 0, 0);
        }
      } else if (recipe === 'remove_background') {
        const imgData = sCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
        const bgR = imgData.data[0], bgG = imgData.data[1], bgB = imgData.data[2];
        for (let i = 0; i < imgData.data.length; i += 4) {
          const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
          const dist = Math.sqrt((r-bgR)**2 + (g-bgG)**2 + (b-bgB)**2);
          if (dist < 40) imgData.data[i+3] = 0;
        }
        sCtx.putImageData(imgData, 0, 0);
      } else if (recipe === 'inventory_icon') {
        applyRecipe('trim_transparent');
        applyResize(64, 64);
      }
    }

    function applyResize(tw, th) {
      const targetW = tw || parseInt(document.getElementById('resize-w')?.value || sourceCanvas.width);
      const targetH = th || parseInt(document.getElementById('resize-h')?.value || sourceCanvas.height);
      const temp = document.createElement('canvas');
      temp.width = targetW; temp.height = targetH;
      temp.getContext('2d').drawImage(sourceCanvas, 0, 0, targetW, targetH);
      sourceCanvas.width = targetW; sourceCanvas.height = targetH;
      drawCanvas.width = targetW; drawCanvas.height = targetH;
      sCtx.drawImage(temp, 0, 0);
    }

    function resetImage() {
      sourceCanvas.width = sourceImage.naturalWidth;
      sourceCanvas.height = sourceImage.naturalHeight;
      drawCanvas.width = sourceImage.naturalWidth;
      drawCanvas.height = sourceImage.naturalHeight;
      sCtx.drawImage(sourceImage, 0, 0);
      redrawMarks();
    }

    document.getElementById('submit-btn').onclick = async () => {
      document.getElementById('loading-overlay').style.display = 'flex';
      try {
        let payload = {};
        if (session.mode === 'region_edit') {
          payload = {
            mask: exportMaskDataUrl(),
            annotation_preview: exportPreviewDataUrl(),
            annotations: marks,
            prompt: document.getElementById('overall-prompt')?.value || '',
            model: document.getElementById('model-select')?.value,
          };
        } else if (session.mode === 'tools' || session.mode === 'image_tools') {
          payload = {
            image_data: sourceCanvas.toDataURL('image/png'),
            recipe: 'custom',
          };
        } else if (session.mode === 'annotate' || session.mode === 'image_annotate') {
          const combined = document.createElement('canvas');
          combined.width = sourceCanvas.width; combined.height = sourceCanvas.height;
          const cCtx = combined.getContext('2d');
          cCtx.drawImage(sourceCanvas, 0, 0);
          cCtx.drawImage(drawCanvas, 0, 0);
          payload = { image_data: combined.toDataURL('image/png') };
        }

        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Asx-Session-Token': token,
          },
          body: json.stringify(payload),
        });
        const result = await res.json();
        if (!res.ok || !result.ok) throw new Error(result.error?.message || 'Submission failed');

        document.getElementById('loading-text').textContent = 'Completed! Returning to agent...';
        setTimeout(() => window.close(), 1000);
      } catch (err) {
        document.getElementById('loading-overlay').style.display = 'none';
        alert('Submit failed: ' + err.message);
      }
    };

    document.getElementById('cancel-btn').onclick = async () => {
      await fetch('/api/cancel', {
        method: 'POST',
        headers: { 'X-Asx-Session-Token': token },
      });
      window.close();
    };

    init();
  </script>
</body>
</html>
