<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asynx Video Workbench · 视频抽帧</title>
  <link rel="stylesheet" href="/plaiers.css">
  <style>
    #viewport { display: flex; flex-direction: column; }
    #stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px; }
    #preview-canvas { max-width: 100%; max-height: 100%; border-radius: var(--r-md); border: 2px solid var(--n800); }
    #playback-bar { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--n900); border-top: 1px solid var(--n700); }
    #playback-bar input[type=range] { flex: 1; min-width: 0; }
    #frame-counter { min-width: 64px; font-size: 18px; color: var(--coin); }
    #frame-counter span { color: var(--n500); }
    .frames-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .frame-thumb { position: relative; aspect-ratio: 1; padding: 0; border: 2px solid var(--n800); border-radius: var(--r-sm); overflow: hidden; background: var(--n950); }
    .frame-thumb:hover { border-color: var(--n600); }
    .frame-thumb.on { border-color: var(--start); }
    .frame-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .frame-thumb .idx { position: absolute; left: 4px; bottom: 4px; padding: 2px 5px 1px; font-size: 12px; line-height: 1; color: var(--text); background: var(--scrim); border-radius: var(--r-xs); }
  </style>
</head>
<body class="pl-portal wb-app">
  <header class="wb-top">
    <h1 class="wb-title">视频抽帧</h1>
    <span class="pl-tag sm" id="mode-badge">载入中</span>
    <div class="wb-actions">
      <div id="account-bar-slot"></div>
      <button type="button" class="btn-text" id="cancel-btn">取消</button>
      <button type="button" class="keycap sm" id="export-btn">导出图集</button>
    </div>
  </header>

  <main class="wb-main">
    <div id="viewport" class="wb-stage">
      <video id="source-video" hidden playsinline crossorigin="anonymous"></video>
      <div id="stage"><canvas id="preview-canvas" class="wb-checker"></canvas></div>
      <div id="playback-bar">
        <button type="button" class="pl-iconbtn" id="play-btn" aria-label="播放"></button>
        <span id="frame-counter" class="num">0 <span>/ 0</span></span>
        <input type="range" id="timeline-slider" min="0" max="0" value="0" aria-label="帧位置">
        <span id="fps-display" class="muted"><span class="num">10</span> FPS</span>
      </div>
    </div>

    <aside class="wb-side">
      <section class="wb-sec">
        <h3>采样</h3>
        <div class="wb-grid2">
          <label class="pl-field"><span>开始（秒）</span><input type="number" id="start-time" value="0.0" step="0.1" min="0"></label>
          <label class="pl-field"><span>结束（秒）</span><input type="number" id="end-time" value="0.0" step="0.1" min="0"></label>
          <label class="pl-field"><span>播放帧率</span><input type="number" id="sample-fps" value="10" min="1" max="60"></label>
          <label class="pl-field"><span>总帧数</span><input type="number" id="target-frames" value="16" min="2" max="120"></label>
        </div>
        <button type="button" class="keycap ghost sm block" onclick="resampleFrames()">重新抽帧</button>
      </section>

      <section class="wb-sec">
        <h3>去背景</h3>
        <label class="pl-check"><input type="checkbox" id="remove-bg">按左上角颜色抠掉背景</label>
        <label class="pl-field"><span>颜色容差</span><input type="range" id="bg-tolerance" min="5" max="80" value="30"></label>
        <p class="wb-note">改完后点「重新抽帧」生效。</p>
      </section>

      <section class="wb-sec">
        <h3>已抽取 <span class="num" id="frame-count-label">0</span> 帧</h3>
        <div class="frames-grid" id="frames-container"></div>
      </section>
    </aside>
  </main>

  <script src="/plaiers-ui.js"></script>
  <script src="/account-bar.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || window.location.hash.replace('#token=', '');
    const isEmbedded = urlParams.get('embedded') === '1';
    const paramSourcePath = urlParams.get('source_path') || '';
    const paramMode = urlParams.get('mode') || '';
    const paramManifestPath = urlParams.get('manifest_path') || '';
    let session = null;
    let video = document.getElementById('source-video');
    let previewCanvas = document.getElementById('preview-canvas');
    let pCtx = previewCanvas.getContext('2d');

    let sampledFrames = [];
    let currentFrameIdx = 0;
    let isPlaying = false;
    let playbackInterval = null;
    const MODE_LABELS = { video_frame_sequence: '抽帧导出', sequence_preview: '序列帧预览' };
    const playBtn = document.getElementById('play-btn');

    function setPlaying(playing) {
      isPlaying = playing;
      playBtn.innerHTML = plIcon(playing ? 'wb-pause' : 'pi-play');
      playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
      if (!playing && playbackInterval) clearInterval(playbackInterval);
    }

    async function init() {
      if (!isEmbedded && window.AsxAccountBar) {
        window.AsxAccountBar.mount('#account-bar-slot', { token });
      }
      if (isEmbedded) {
        const slot = document.getElementById('account-bar-slot');
        if (slot) slot.style.display = 'none';
      }
      const qs = new URLSearchParams();
      if (paramSourcePath) qs.set('source_path', paramSourcePath);
      if (paramMode) qs.set('mode', paramMode);
      if (paramManifestPath) qs.set('manifest_path', paramManifestPath);
      const res = await fetch('/api/session' + (qs.toString() ? '?' + qs.toString() : ''), {
        headers: { 'X-Asx-Session-Token': token },
      });
      session = await res.json();
      document.getElementById('mode-badge').textContent = MODE_LABELS[session.mode] || session.mode;
      setPlaying(false);

      if (session.mode === 'sequence_preview') {
        document.getElementById('export-btn').style.display = 'none';
        loadSequencePreview();
        return;
      }

      video.src = session.source_url
        ? (session.source_url.includes('?') ? session.source_url : session.source_url + '?token=' + encodeURIComponent(token))
        : ('/api/source?token=' + encodeURIComponent(token));
      video.onloadedmetadata = () => {
        document.getElementById('end-time').value = video.duration.toFixed(2);
        resampleFrames();
      };
    }

    async function resampleFrames() {
      const startTime = parseFloat(document.getElementById('start-time').value) || 0;
      const endTime = parseFloat(document.getElementById('end-time').value) || video.duration;
      const targetFrames = parseInt(document.getElementById('target-frames').value) || 16;
      const removeBg = document.getElementById('remove-bg').checked;
      const tolerance = parseInt(document.getElementById('bg-tolerance').value) || 30;

      sampledFrames = [];
      const duration = Math.max(0.1, endTime - startTime);
      const step = duration / targetFrames;

      previewCanvas.width = video.videoWidth || 256;
      previewCanvas.height = video.videoHeight || 256;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = previewCanvas.width;
      offCanvas.height = previewCanvas.height;
      const oCtx = offCanvas.getContext('2d');

      for (let i = 0; i < targetFrames; i++) {
        const time = startTime + i * step;
        video.currentTime = time;
        await new Promise(r => video.onseeked = r);

        oCtx.drawImage(video, 0, 0, offCanvas.width, offCanvas.height);
        if (removeBg) {
          const imgData = oCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
          const bgR = imgData.data[0], bgG = imgData.data[1], bgB = imgData.data[2];
          for (let p = 0; p < imgData.data.length; p += 4) {
            const r = imgData.data[p], g = imgData.data[p+1], b = imgData.data[p+2];
            const dist = Math.sqrt((r-bgR)**2 + (g-bgG)**2 + (b-bgB)**2);
            if (dist < tolerance) imgData.data[p+3] = 0;
          }
          oCtx.putImageData(imgData, 0, 0);
        }

        const dataUrl = offCanvas.toDataURL('image/png');
        sampledFrames.push(dataUrl);
      }

      renderThumbs();
      document.getElementById('timeline-slider').max = sampledFrames.length - 1;
      showFrame(0);
      startPlayback();
    }

    function renderThumbs() {
      const container = document.getElementById('frames-container');
      document.getElementById('frame-count-label').textContent = sampledFrames.length;
      container.innerHTML = sampledFrames.map((url, i) => `
        <button type="button" class="frame-thumb" onclick="setPlaying(false); showFrame(${i})" aria-label="第 ${i + 1} 帧">
          <img src="${url}" alt="">
          <span class="idx num">${i + 1}</span>
        </button>
      `).join('');
    }

    function showFrame(index) {
      if (!sampledFrames.length) return;
      currentFrameIdx = (index + sampledFrames.length) % sampledFrames.length;
      const img = new Image();
      img.onload = () => {
        pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        pCtx.drawImage(img, 0, 0);
      };
      img.src = sampledFrames[currentFrameIdx];
      document.getElementById('frame-counter').innerHTML = `${currentFrameIdx + 1} <span>/ ${sampledFrames.length}</span>`;
      document.querySelectorAll('.frame-thumb').forEach((el, i) => el.classList.toggle('on', i === currentFrameIdx));
      document.getElementById('timeline-slider').value = currentFrameIdx;
    }

    function startPlayback() {
      if (playbackInterval) clearInterval(playbackInterval);
      const fps = parseInt(document.getElementById('sample-fps').value) || 10;
      setPlaying(true);
      document.querySelector('#fps-display .num').textContent = fps;
      playbackInterval = setInterval(() => {
        showFrame(currentFrameIdx + 1);
      }, 1000 / fps);
    }

    document.getElementById('play-btn').onclick = () => {
      if (isPlaying) {
        setPlaying(false);
      } else {
        startPlayback();
      }
    };

    document.getElementById('timeline-slider').oninput = (e) => {
      if (isPlaying) setPlaying(false);
      showFrame(parseInt(e.target.value));
    };

    document.getElementById('export-btn').onclick = async () => {
      if (!sampledFrames.length) return plToast('还没有抽到帧，先点「重新抽帧」', 'warn');
      const cols = Math.ceil(Math.sqrt(sampledFrames.length));
      const rows = Math.ceil(sampledFrames.length / cols);
      const frameW = previewCanvas.width;
      const frameH = previewCanvas.height;

      const atlasCanvas = document.createElement('canvas');
      atlasCanvas.width = cols * frameW;
      atlasCanvas.height = rows * frameH;
      const aCtx = atlasCanvas.getContext('2d');

      const manifestFrames = {};
      const fps = parseInt(document.getElementById('sample-fps').value) || 10;
      const frameDuration = 1.0 / fps;

      for (let i = 0; i < sampledFrames.length; i++) {
        const c = i % cols;
        const r = Math.floor(i / cols);
        const x = c * frameW;
        const y = r * frameH;

        const img = new Image();
        img.src = sampledFrames[i];
        await new Promise(res => img.onload = res);
        aCtx.drawImage(img, x, y);

        const frameName = `frame-${String(i).padStart(4, '0')}.png`;
        manifestFrames[frameName] = {
          frame: { x, y, w: frameW, h: frameH },
          rotated: false,
          trimmed: false,
          spriteSourceSize: { x: 0, y: 0, w: frameW, h: frameH },
          sourceSize: { w: frameW, h: frameH },
          duration: frameDuration,
        };
      }

      const atlasDataUrl = atlasCanvas.toDataURL('image/png');
      const manifest = {
        frames: manifestFrames,
        meta: {
          app: 'plaiers-asynx-video',
          version: '1.0',
          image: 'atlas.png',
          format: 'RGBA8888',
          size: { w: atlasCanvas.width, h: atlasCanvas.height },
          scale: 1,
          frame_count: sampledFrames.length,
          columns: cols,
          rows: rows,
          fps: fps,
        },
      };

      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Asx-Session-Token': token },
        body: JSON.stringify({
          mode: 'video_frame_sequence',
          ...(paramSourcePath ? { source_path: paramSourcePath } : {}),
          ...(isEmbedded ? { keep_alive: true } : {}),
          atlas: atlasDataUrl,
          manifest,
        }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        if (isEmbedded && window.parent !== window) {
          window.parent.postMessage({ type: 'asx-workbench-complete', result: data.result }, '*');
          return;
        }
        plToast('图集已导出，可以关闭这个页面了', 'ok');
        setTimeout(() => window.close(), 1200);
      } else {
        plToast('导出失败：' + (data.error?.message || '未知错误'), 'err', 6000);
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !isEmbedded || window.parent === window) return;
      window.parent.postMessage({ type: 'asx-workbench-cancel' }, '*');
    });

    document.getElementById('cancel-btn').onclick = async () => {
      if (isEmbedded && window.parent !== window) {
        window.parent.postMessage({ type: 'asx-workbench-cancel' }, '*');
        return;
      }
      await fetch('/api/cancel', { method: 'POST', headers: { 'X-Asx-Session-Token': token } });
      window.close();
    };

    async function loadSequencePreview() {
      const mUrl = '/api/manifest?token=' + encodeURIComponent(token) + (paramManifestPath ? '&path=' + encodeURIComponent(paramManifestPath) : '');
      const manifestRes = await fetch(mUrl);
      const manifest = await manifestRes.json();
      const atlasImg = new Image();
      atlasImg.onload = () => {
        const frameKeys = Object.keys(manifest.frames || {});
        let idx = 0;
        setInterval(() => {
          if (!frameKeys.length) return;
          const k = frameKeys[idx % frameKeys.length];
          const f = manifest.frames[k].frame;
          previewCanvas.width = f.w;
          previewCanvas.height = f.h;
          pCtx.clearRect(0, 0, f.w, f.h);
          pCtx.drawImage(atlasImg, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);
          idx++;
        }, 1000 / (manifest.meta?.fps || 10));
      };
      atlasImg.src = session.source_url
        ? (session.source_url.includes('?') ? session.source_url : session.source_url + '?token=' + encodeURIComponent(token))
        : ('/api/source?token=' + encodeURIComponent(token));
    }

    init();
  </script>
</body>
</html>
