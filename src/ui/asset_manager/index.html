<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asynx Asset Manager Workbench</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 520px;
      width: 90%;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0;
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Asynx Asset Manager Workbench</h1>
    <p id="status">Workbench shell initialized. Use CLI <code>scan</code>, <code>list</code>, or <code>lineage</code> to inspect workspace assets.</p>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get("token") || window.location.hash.replace("#token=", "");
    if (token) {
      fetch("/api/session", { headers: { "X-Asx-Session-Token": token } })
        .then((r) => r.json())
        .then((data) => {
          if (data && data.metadata && data.metadata.workspace_root) {
            document.getElementById("status").textContent = "Workspace: " + data.metadata.workspace_root;
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
