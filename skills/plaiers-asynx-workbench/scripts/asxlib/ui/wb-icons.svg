<svg xmlns="http://www.w3.org/2000/svg">
<!-- 工作台专用图标。品牌 sprite（plaiers-icons.svg）里没有的，按同一规格补：24px 网格、2px 圆端线、最多一块实心点缀（plaiers-icon-accent 变量）。
     品牌 sprite 已有的（close、play、search、update、settings……）直接用 pi-*，这里不重画。
     根元素不要加 style="display:none"：作为外部文件被 <use> 引用时，Chrome 会因此整组不渲染（品牌 sprite 的副本同样去掉了）。 -->
<symbol id="wb-brush" viewBox="0 0 24 24"><title>涂鸦</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-3.5 1.5-7.5 5.5-9 8.5l2.5 2.5C16.5 13.5 20.5 9.5 20 4z"/><path d="M10 15c-2 0-3.5 1.4-3.5 3.2 0 .9-.6 1.6-1.5 1.8 3.4 1.2 7-.4 7-3.1"/><rect x="14.5" y="7" width="3" height="3" rx=".5" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none" transform="rotate(45 16 8.5)"/></g></symbol>
<symbol id="wb-point" viewBox="0 0 24 24"><title>指向</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 17 7"/><path d="M9 6h9v9"/><rect x="4" y="16" width="4" height="4" rx="1" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-rect" viewBox="0 0 24 24"><title>框选</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2" stroke-dasharray="3 3"/><rect x="2.5" y="3.5" width="3" height="3" rx=".5" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-lasso" viewBox="0 0 24 24"><title>圈选</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 17.5C4.8 16.3 3 14.3 3 12c0-4 4-7 9-7s9 3 9 7-4 7-9 7c-1 0-2-.1-2.9-.3"/><path d="M7.5 17.5c-.6 1.5-.1 3 1.5 3.5"/><circle cx="8.5" cy="17" r="1.8" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-edit" viewBox="0 0 24 24"><title>编辑</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"/><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><rect x="13" y="6" width="3" height="3" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none" transform="rotate(45 14.5 7.5)"/></g></symbol>
<symbol id="wb-erase" viewBox="0 0 24 24"><title>删除标记</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20-3.3-3.3a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l4.6 4.6a2 2 0 0 1 0 2.8L13 20z"/><path d="M20 20H7"/><path d="M5.5 12.5 9 9l5.5 5.5L11 18z" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-trash" viewBox="0 0 24 24"><title>清空</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7"/><rect x="10.5" y="11" width="3" height="5" rx=".5" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-check" viewBox="0 0 24 24"><title>确认</title><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></g></symbol>
<symbol id="wb-pause" viewBox="0 0 24 24"><title>暂停</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="var(--plaiers-icon-accent, #FA7301)"/><rect x="14" y="5" width="4" height="14" rx="1"/></g></symbol>
<symbol id="wb-folder" viewBox="0 0 24 24"><title>目录</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7A1.5 1.5 0 0 1 5 5.5h4l2 2h8A1.5 1.5 0 0 1 20.5 9v8.5A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/><rect x="6.5" y="11" width="4" height="4" rx="1" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-layers" viewBox="0 0 24 24"><title>缓存</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3.5 8.5 12 13l8.5-4.5z" fill="var(--plaiers-icon-accent, #FA7301)"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></g></symbol>
<symbol id="wb-image" viewBox="0 0 24 24"><title>图片</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m3.5 16 5-5 4 4 2.5-2.5 5.5 5.5"/><rect x="14" y="7.5" width="3" height="3" rx=".5" fill="var(--plaiers-icon-accent, #FA7301)" stroke="none"/></g></symbol>
<symbol id="wb-audio" viewBox="0 0 24 24"><title>音频</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5" fill="var(--plaiers-icon-accent, #FA7301)"/></g></symbol>
<symbol id="wb-video" viewBox="0 0 24 24"><title>视频</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z" fill="var(--plaiers-icon-accent, #FA7301)"/></g></symbol>
<symbol id="wb-frames" viewBox="0 0 24 24"><title>序列帧</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" fill="var(--plaiers-icon-accent, #FA7301)"/></g></symbol>
<symbol id="wb-cube" viewBox="0 0 24 24"><title>3D 模型</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M12 21v-9M20 7.5 12 12 4 7.5"/><path d="M12 3 20 7.5 12 12 4 7.5z" fill="var(--plaiers-icon-accent, #FA7301)"/></g></symbol>
</svg>
