<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asynx Asset Manager Workbench · 资产管理</title>
  <link rel="stylesheet" href="/plaiers.css">
  <style>
    /* 顶栏 */
    #search-input { font-size: 14px; }
    .wb-top .pl-search { flex: 1 1 420px; }
    #source-filter { width: auto; flex: none; }
    #workspace-root-label { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }

    /* 分类条 */
    .tabs-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--n950); border-bottom: 1px solid var(--n800); }
    .category-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    #scan-summary { font-size: 13px; color: var(--n400); white-space: nowrap; }

    /* 目录树 */
    .tree-pane { width: 240px; flex: none; overflow: auto; padding: 10px 8px; background: var(--n900); border-right: 1px solid var(--n700); font-size: 13px; }
    .tree-pane.collapsed { display: none; }
    .tree-row { display: flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: var(--r-sm); color: var(--n400); white-space: nowrap; cursor: pointer; }
    .tree-row:hover { background: var(--n850); color: var(--text); }
    .tree-row.active { background: var(--n850); color: var(--text); font-weight: 700; box-shadow: inset 3px 0 0 var(--start); }
    .tree-toggle { flex: none; width: 14px; text-align: center; font-size: 12px; color: var(--n500); }
    .tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .tree-count { font-size: 12px; color: var(--n500); }

    /* 资产网格 */
    .grid-pane { flex: 1; min-width: 0; overflow-y: auto; padding: 16px; }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .asset-card { content-visibility: auto; contain-intrinsic-size: 200px 220px; display: flex; flex-direction: column; overflow: hidden; background: var(--n900); border: 2px solid var(--n800); border-radius: var(--r-lg); cursor: pointer; transition: transform var(--dur-fast), border-color var(--dur-fast); }
    .asset-card:hover { border-color: var(--n600); transform: translateY(-2px); }
    .asset-card.selected { border-color: var(--start); }
    .card-thumb { position: relative; height: 136px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--n950); }
    .card-thumb.checker { background-color: var(--n950); background-image: linear-gradient(45deg, var(--n850) 25%, transparent 25%), linear-gradient(-45deg, var(--n850) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--n850) 75%), linear-gradient(-45deg, transparent 75%, var(--n850) 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
    .card-thumb img, .card-thumb video { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card-thumb img.thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; background: var(--n950); }
    .card-thumb .flag { position: absolute; top: 8px; left: 8px; }
    .thumb-glyph { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--n400); }
    .thumb-glyph svg.i { width: 32px; height: 32px; }
    .card-body { display: grid; gap: 6px; padding: 10px 12px 12px; }
    .card-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--n400); }
    .card-meta-row .pl-tag { min-width: 0; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

    /* 缓存菜单 */
    .cache-menu { position: relative; }
    .cache-pop { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 70; width: 260px; padding: 14px; font-size: 13px; }
    .cache-pop.open { display: grid; gap: 8px; }
    .cache-pop .row { display: flex; justify-content: space-between; color: var(--n400); }
    .cache-pop .row b { color: var(--coin); font-weight: 400; }
    .cache-pop .dir { font-size: 12px; color: var(--n500); word-break: break-all; }

    /* 检查器 */
    .inspector-pane { width: 470px; flex: none; display: flex; flex-direction: column; overflow-y: auto; background: var(--n900); border-left: 1px solid var(--n700); }
    .inspector-empty { flex: 1; }
    .insp-section { display: grid; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--n800); }
    .insp-section:last-child { border-bottom: 0; }
    .insp-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 700 15px/1.3 var(--cn); }
    .insp-title .muted { font-size: 13px; font-weight: 400; }
    .insp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .insp-name { font: 900 17px/1.3 var(--cn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .insp-path { margin-top: 2px; font-size: 12px; color: var(--n500); word-break: break-all; }
    .preview-stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 220px; max-height: 300px; padding: 10px; overflow: hidden; background: var(--n950); border: 2px solid var(--n800); border-radius: var(--r-lg); }
    .preview-stage img, .preview-stage video { max-width: 100%; max-height: 260px; object-fit: contain; }
    .preview-stage video { width: 100%; }
    .preview-stage audio { width: 100%; }
    #audio-wave-canvas { width: 100%; height: 90px; border-radius: var(--r-sm); }
    #sprite-canvas { max-width: 100%; max-height: 190px; border-radius: var(--r-sm); }
    .three-wrap { position: relative; width: 100%; }
    #three-preview-canvas { display: block; width: 100%; height: 220px; border-radius: var(--r-sm); cursor: grab; }
    #three-preview-meta { width: 100%; font-size: 12px; color: var(--n400); }
    .anim-overlay { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; padding: 4px; background: var(--scrim); border-radius: var(--r-pill); }
    .anim-overlay select { width: auto; max-width: 160px; }
    .anim-overlay .pl-iconbtn { width: 32px; height: 32px; }
    .sprite-controls { width: 100%; display: grid; gap: 8px; }
    .sprite-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--n300); }
    .sprite-row label { display: inline-flex; align-items: center; gap: 6px; }
    .sprite-row input[type=range] { flex: 1; min-width: 120px; }
    #sp-fps { width: 64px; }
    #sp-dir { width: auto; }
    #sp-counter { margin-left: auto; font-size: 16px; color: var(--coin); }
    .meta-table { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 13px; }
    .meta-k { color: var(--n400); }
    .meta-v { color: var(--text); word-break: break-word; }
    .meta-v.mono { font: 12px/1.5 var(--mono); color: var(--n300); }

    /* 血缘 */
    .lineage-label { font-size: 13px; color: var(--n400); }
    .lineage-label.next { margin-top: 8px; }
    .min0 { min-width: 0; }
    .grid-full { grid-column: 1 / -1; }
    .check-cell { display: flex; align-items: flex-end; padding-bottom: 10px; }
    .lineage-cards { display: grid; gap: 6px; }
    .lineage-none { font-size: 13px; color: var(--n500); }
    .lineage-node-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--n850); border: 1px solid var(--n700); border-radius: var(--r-md); color: var(--text); text-align: left; cursor: pointer; }
    .lineage-node-card:hover { border-color: var(--n500); }
    .lineage-node-card .ln-name { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lineage-node-card .ln-op { font-size: 12px; color: var(--n400); }
    .lineage-node-card .ln-go { flex: none; font-size: 12px; color: var(--n300); }
    .dag-box { max-height: 260px; overflow: auto; padding: 8px; background: var(--n950); border: 1px solid var(--n800); border-radius: var(--r-md); }
    .dag-edge { stroke: var(--n600); stroke-width: 1.5; fill: none; }
    .dag-op { fill: var(--n400); font: 12px var(--cn); }
    .dag-node { cursor: pointer; }
    .dag-node rect { fill: var(--n850); stroke: var(--n700); stroke-width: 1.5; }
    .dag-node:hover rect { stroke: var(--n500); }
    .dag-node text { fill: var(--text); font: 12px var(--cn); }
    .dag-node.cur rect { fill: var(--start); stroke: var(--start); }
    .dag-node.cur text { fill: var(--cocoa); font-weight: 700; }

    /* 操作区：分组之间用细线隔开，不再套框 */
    #actions-body { display: grid; gap: 0; }
    .action-group { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--n800); }
    .action-group:first-child, .pl-tabs + .action-group { border-top: 0; padding-top: 4px; }
    .pl-tabs + .action-group { padding-top: 16px; }
    .action-group h4 { font: 700 14px/1.4 var(--cn); color: var(--text); }
    .action-group h4 small { font-weight: 400; font-size: 12px; color: var(--n400); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-full { display: grid; gap: 6px; }
    label.fl { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--n300); }
    .field-full label.fl { margin-bottom: 0; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .action-group .divider { height: 1px; margin: 4px 0; border: 0; background: var(--n800); }
    #rig-status { font-size: 13px; color: var(--n400); }
    .mux-row { display: flex; gap: 8px; }
    .mux-row .keycap { flex: none; }
    .action-result-box { margin-top: 4px; max-height: 160px; overflow: auto; padding: 10px 12px; font: 12px/1.5 var(--mono); color: var(--n300); white-space: pre-wrap; background: var(--n950); border: 1px solid var(--n800); border-radius: var(--r-sm); }
    .action-result-box.err { color: var(--danger); border-color: var(--danger-line); background: var(--surface-danger); }

    /* 多选动画下拉 */
    .combo { position: relative; }
    .combo-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer; }
    .combo-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .combo-pop { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60; }
    .combo.open .combo-pop { display: block; }
    .combo-list { max-height: 220px; overflow-y: auto; margin-top: 6px; }
    .combo-group { padding: 6px 8px 2px; font-size: 12px; color: var(--n500); }
    .combo-item { padding: 6px 10px; font-size: 13px; border-radius: var(--r-sm); cursor: pointer; }
    .combo-item:hover { background: var(--n850); }
    .combo-item.sel { color: var(--coin); font-weight: 700; }

    /* 嵌入子工作台 */
    #embedded-modal { padding: 16px; }
    .modal-shell { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .modal-shell iframe { flex: 1; width: 100%; border: 0; background: var(--n950); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="pl-portal wb-app">
  <header class="wb-top">
    <h1 class="wb-title">资产管理</h1>
    <span class="pl-tag sm" id="workspace-root-label" title="">工作区 --</span>
    <label class="pl-search">
      <svg class="i sm" aria-hidden="true"><use href="/plaiers-icons.svg#pi-search"></use></svg>
      <input type="search" id="search-input" placeholder="搜文件名、路径、Prompt、模型、操作或 Task ID" aria-label="搜索资产" />
    </label>
    <select class="pl-input" id="source-filter" aria-label="来源">
      <option value="all">全部来源</option>
      <option value="managed">Asynx Skill 产出</option>
      <option value="external">外部文件</option>
    </select>
    <button type="button" class="keycap ghost sm" id="rescan-btn" title="忽略缓存，重新扫描工作区"><svg class="i sm" aria-hidden="true"><use href="/plaiers-icons.svg#pi-update"></use></svg>重新扫描</button>
    <div class="wb-actions">
      <div class="cache-menu">
        <button type="button" class="btn-text" id="cache-btn" title="缩略图缓存"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-layers"></use></svg>缓存</button>
        <div class="cache-pop menu" id="cache-pop">
          <div class="row"><span>缩略图数量</span><b class="num" id="cache-count">--</b></div>
          <div class="row"><span>占用空间</span><b class="num" id="cache-size">--</b></div>
          <div class="dir" id="cache-dir"></div>
          <button type="button" class="keycap ghost sm block" id="cache-clear-btn">清除缓存</button>
        </div>
      </div>
      <div id="account-bar-slot"></div>
    </div>
  </header>

  <div class="tabs-bar">
    <div class="category-tabs" id="category-tabs">
      <button type="button" class="pl-iconbtn" id="tree-toggle-btn" title="收起/展开目录" aria-label="收起/展开目录" aria-expanded="true"><svg class="i sm" aria-hidden="true"><use href="/wb-icons.svg#wb-folder"></use></svg></button>
      <button type="button" class="pl-tag cat-tab on" data-cat="all">全部 <span class="num" id="cnt-all">0</span></button>
      <button type="button" class="pl-tag cat-tab" data-cat="image">图片 <span class="num" id="cnt-image">0</span></button>
      <button type="button" class="pl-tag cat-tab" data-cat="audio">音频 <span class="num" id="cnt-audio">0</span></button>
      <button type="button" class="pl-tag cat-tab" data-cat="frame_sequence">序列帧 <span class="num" id="cnt-frame_sequence">0</span></button>
      <button type="button" class="pl-tag cat-tab" data-cat="video">视频 <span class="num" id="cnt-video">0</span></button>
      <button type="button" class="pl-tag cat-tab" data-cat="3d">3D 模型 <span class="num" id="cnt-3d">0</span></button>
    </div>
    <div id="scan-summary">就绪</div>
  </div>

  <div class="wb-main">
    <aside class="tree-pane" id="tree-pane" aria-label="项目目录"></aside>
    <section class="grid-pane">
      <div class="asset-grid" id="asset-grid"></div>
    </section>

    <aside class="inspector-pane" id="inspector-pane">
      <div class="inspector-empty pl-empty" id="inspector-empty">
        <strong>还没选资产</strong>
        <span>点任意卡片，查看预览、血缘关系和可用的编辑操作。</span>
      </div>
      <div id="inspector-content" hidden></div>
    </aside>
  </div>

  <div class="pl-scrim" id="embedded-modal">
    <div class="pl-dialog modal-shell" role="dialog" aria-modal="true" aria-labelledby="embedded-title">
      <div class="pl-dialog-head">
        <h2 id="embedded-title">子工作台</h2>
        <button type="button" class="pl-iconbtn" id="embedded-close-btn" aria-label="关闭"><svg class="i sm" aria-hidden="true"><use href="/plaiers-icons.svg#pi-close"></use></svg></button>
      </div>
      <iframe id="embedded-frame" src="about:blank" title="子工作台"></iframe>
    </div>
  </div>

  <script src="/plaiers-ui.js"></script>
  <script src="/account-bar.js"></script>
  <script src="/model3d-loader.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || window.location.hash.replace('#token=', '');
    const state = {
      session: null,
      assets: [],
      counts: {},
      category: 'all',
      dir: '',
      collapsed: new Set(),
      source: 'all',
      query: '',
      selectedPath: null,
      lineage: null,
      lineageView: 'cards', // 'cards' | 'graph'
      spritePlayer: { timer: null, playing: true, idx: 0, fps: 10, direction: 'all', onionSkin: false, showGrid: false, keys: [], manifest: null, img: null },
      threeCleanup: null,
      busyAction: false,
    };

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatBytes(b) {
      if (b == null) return '--';
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function fileUrl(path) {
      return '/api/workspace-file?token=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
    }

    function showToast(msg, kind) {
      plToast(msg, kind === 'error' ? 'err' : 'ok', kind === 'error' ? 6000 : 4500);
    }

    async function apiGet(url) {
      const res = await fetch(url, { headers: { 'X-Asx-Session-Token': token } });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        const err = new Error((data.error && data.error.message) || 'Request failed');
        err.code = data.error && data.error.code;
        err.status = res.status;
        throw err;
      }
      return data;
    }

    async function apiAction(payload) {
      // 云端动作先报价；需要用户确认积分消耗时由 plPostWithChargeConsent 询问后再重发
      const { res, data } = await window.plPostWithChargeConsent('/api/manager/action', payload, {
        'Content-Type': 'application/json',
        'X-Asx-Session-Token': token,
      });
      if (!res.ok || !data.ok) {
        const err = new Error((data.error && data.error.message) || 'Action failed');
        err.code = data.error && data.error.code;
        err.status = res.status;
        throw err;
      }
      return data;
    }

    // 来源标签：卡片左上角只标 Skill 产出（斜切标签），外部文件是默认情况，不再加标
    function badgeInfo(asset) {
      if (!asset.managed) return { flag: '', label: '外部文件' };
      if (asset.source_kind === 'cloud_task') return { flag: 'cream', label: 'AI 生成' };
      return { flag: 'cocoa', label: 'Skill 处理' };
    }

    const CATEGORY_LABELS = { image: '图片', audio: '音频', frame_sequence: '序列帧', video: '视频', '3d': '3D 模型' };

    function clearFilters() {
      state.category = 'all';
      state.dir = '';
      state.source = 'all';
      state.query = '';
      document.getElementById('search-input').value = '';
      document.getElementById('source-filter').value = 'all';
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('on', b.dataset.cat === 'all'));
      loadAssets();
    }

    function stopPreviewTimers() {
      if (state.spritePlayer.timer) {
        clearInterval(state.spritePlayer.timer);
        state.spritePlayer.timer = null;
      }
      if (typeof state.threeCleanup === 'function') {
        state.threeCleanup();
        state.threeCleanup = null;
      }
    }

    // 全量数据只拉取一次，切换 tab / 筛选 / 搜索在前端内存中完成，避免每次重新扫描工作区。
    function applyLocalFilter() {
      const q = state.query.trim().toLowerCase();
      return (state.allAssets || []).filter(a => {
        if (state.category !== 'all' && a.category !== state.category) return false;
        if (state.dir && !(a.relative_path || '').startsWith(state.dir + '/')) return false;
        if (state.source === 'managed' && !a.managed) return false;
        if (state.source === 'external' && a.managed) return false;
        if (q) {
          if (a._hay === undefined) {
            a._hay = [a.name, a.relative_path, a.path, a.prompt, a.model, a.operation,
              a.task_id, a.artifact_id, a.category].filter(Boolean).join(' ').toLowerCase();
          }
          if (!a._hay.includes(q)) return false;
        }
        return true;
      });
    }

    async function loadAssets(opts) {
      try {
        if ((opts && (opts.noCache || opts.refetch)) || !state.allAssets) {
          const qs = new URLSearchParams();
          if (opts && opts.noCache) qs.set('no_cache', '1');
          const data = await apiGet('/api/assets?' + qs.toString());
          state.allAssets = data.assets || [];
          state.counts = data.counts || {};
          updateCounts();
        }
        updateCounts();
        state.assets = applyLocalFilter();
        renderTree();
        renderGrid();
        if (state.selectedPath) {
          const stillThere = state.assets.find(a => a.path === state.selectedPath);
          if (stillThere) {
            if (opts && opts.lineageOnly) await refreshSelectedLineage();
            else await selectAsset(stillThere.path, { skipGridRender: true });
          }
        }
      } catch (err) {
        showToast('扫描工作区失败: ' + err.message, 'error');
      }
    }

    function buildDirTree() {
      const root = { name: '项目根目录', path: '', children: new Map(), count: 0 };
      for (const a of (state.allAssets || [])) {
        const parts = (a.relative_path || '').split('/').filter(Boolean);
        parts.pop();
        let node = root;
        node.count++;
        let cur = '';
        for (const p of parts) {
          cur = cur ? cur + '/' + p : p;
          if (!node.children.has(p)) node.children.set(p, { name: p, path: cur, children: new Map(), count: 0 });
          node = node.children.get(p);
          node.count++;
        }
      }
      return root;
    }

    function renderTree() {
      const pane = document.getElementById('tree-pane');
      if (!pane) return;
      const rows = [];
      const walk = (node, depth) => {
        const kids = [...node.children.values()].sort((x, y) => x.name.localeCompare(y.name));
        const open = !state.collapsed.has(node.path);
        const toggle = kids.length ? (open ? '▾' : '▸') : '';
        rows.push(`<div class="tree-row ${node.path === state.dir ? 'active' : ''}" data-dir="${escapeHtml(node.path)}" style="padding-left:${6 + depth * 14}px" title="${escapeHtml(node.path || '/')}">
          <span class="tree-toggle" data-toggle="1">${toggle}</span>
          <span class="tree-label">${escapeHtml(node.name)}</span>
          <span class="tree-count">${node.count}</span></div>`);
        if (open) kids.forEach(k => walk(k, depth + 1));
      };
      walk(buildDirTree(), 0);
      pane.innerHTML = rows.join('');
    }

    function updateCounts() {
      const inDir = (state.allAssets || []).filter(a =>
        !state.dir || (a.relative_path || '').startsWith(state.dir + '/'));
      const byCat = {};
      let managed = 0;
      for (const a of inDir) {
        byCat[a.category] = (byCat[a.category] || 0) + 1;
        if (a.managed) managed++;
      }
      document.getElementById('cnt-all').textContent = inDir.length;
      for (const cat of ['image', 'audio', 'frame_sequence', 'video', '3d']) {
        const el = document.getElementById('cnt-' + cat);
        if (el) el.textContent = byCat[cat] ?? 0;
      }
      const relinked = (!state.dir && state.counts && state.counts.relinked) ? ` · 重连 ${state.counts.relinked}` : '';
      document.getElementById('scan-summary').textContent =
        `共 ${inDir.length} 项 · Skill 产出 ${managed} · 外部 ${inDir.length - managed}${relinked}`;
    }

    function glyphSvg(cat) {
      return plIcon(cat === 'audio' ? 'wb-audio' : cat === '3d' ? 'wb-cube' : 'wb-video');
    }

    function glyphHtml(asset) {
      return `<div class="thumb-glyph">${glyphSvg(asset.category)}<span>${escapeHtml(asset.ext || asset.category)}</span></div>`;
    }

    // ---- Thumbnail cache (video / 3D): browser renders once, server stores JPEG outside the project ----
    function thumbUrl(path) {
      return '/api/thumb?token=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
    }

    function thumbImgHtml(asset) {
      return `<img class="thumb-img" loading="lazy" alt="" data-cat="${asset.category}" data-path="${escapeHtml(asset.path)}" src="${thumbUrl(asset.path)}" onerror="asxThumbMiss(this)" />`;
    }

    const thumbQueue = { items: [], running: false, renderer: null };

    window.asxThumbMiss = function (img) {
      img.onerror = null;
      img.style.display = 'none';
      thumbQueue.items.push(img);
      pumpThumbQueue();
    };

    async function pumpThumbQueue() {
      if (thumbQueue.running) return;
      thumbQueue.running = true;
      try {
        while (thumbQueue.items.length) {
          const img = thumbQueue.items.shift();
          if (!img.isConnected) continue;
          const path = img.dataset.path;
          try {
            const dataUrl = img.dataset.cat === 'video' ? await renderVideoThumb(path) : await renderModelThumb(path);
            if (!dataUrl) continue;
            const saved = await fetch('/api/thumb', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Asx-Session-Token': token },
              body: JSON.stringify({ path, image_data: dataUrl }),
            });
            // 缓存写不进去时直接用本地渲染结果，不显示破图
            img.onerror = () => { img.style.display = 'none'; };
            img.src = saved.ok ? thumbUrl(path) + '&t=' + Date.now() : dataUrl;
            img.style.display = '';
          } catch (_) { /* keep glyph */ }
        }
      } finally {
        thumbQueue.running = false;
        refreshCacheStats();
      }
    }

    function renderVideoThumb(path) {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.muted = true; v.preload = 'auto'; v.playsInline = true;
        const done = (val) => { clearTimeout(timer); v.removeAttribute('src'); v.load(); resolve(val); };
        const timer = setTimeout(() => done(null), 10000);
        v.onerror = () => done(null);
        v.onloadedmetadata = () => {
          const d = isFinite(v.duration) ? v.duration : 0;
          v.currentTime = Math.min(Math.max(d * 0.1, 0.1), Math.max(d - 0.05, 0));
        };
        v.onseeked = () => {
          try {
            const scale = Math.min(1, 320 / (v.videoWidth || 320));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round((v.videoWidth || 320) * scale));
            c.height = Math.max(1, Math.round((v.videoHeight || 180) * scale));
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            done(c.toDataURL('image/jpeg', 0.8));
          } catch (_) { done(null); }
        };
        v.src = fileUrl(path);
      });
    }

    async function renderModelThumb(path) {
      const loader = window.AsxModel3DLoader;
      if (!window.THREE || !loader) return null;
      const SIZE = 256;
      if (!thumbQueue.renderer) {
        const canvas = document.createElement('canvas');
        canvas.width = SIZE; canvas.height = SIZE;
        thumbQueue.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        thumbQueue.renderer.setSize(SIZE, SIZE, false);
      }
      const renderer = thumbQueue.renderer;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(plColor('--n950'));
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.set(0, 0.9, 3.2);
      camera.lookAt(0, 0, 0);
      const envTex = loader.setupStudioLighting(THREE, renderer, scene);
      let loaded = null;
      try {
        const name = path.split('/').pop();
        loaded = await Promise.race([
          loader.loadModelFromUrl(THREE, fileUrl(path), name, { headers: { 'X-Asx-Session-Token': token } }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000)),
        ]);
        if (loaded.stats && loaded.stats.isFallback) return null; // don't cache placeholder proxies
        loaded.root.rotation.y = -0.6;
        scene.add(loaded.root);
        renderer.render(scene, camera);
        return renderer.domElement.toDataURL('image/jpeg', 0.85);
      } catch (_) {
        return null;
      } finally {
        if (loaded) loader.disposeObject3D(loaded.root);
        if (envTex && envTex.dispose) envTex.dispose();
      }
    }

    function formatCacheBytes(n) {
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function refreshCacheStats() {
      try {
        const st = await apiGet('/api/thumb-cache');
        document.getElementById('cache-count').textContent = st.count;
        document.getElementById('cache-size').textContent = formatCacheBytes(st.bytes) + ' / ' + formatCacheBytes(st.limit_bytes);
        document.getElementById('cache-dir').textContent = st.dir;
      } catch (_) {}
    }

    function initCacheMenu() {
      const pop = document.getElementById('cache-pop');
      document.getElementById('cache-btn').onclick = (e) => {
        e.stopPropagation();
        pop.classList.toggle('open');
        if (pop.classList.contains('open')) refreshCacheStats();
      };
      pop.onclick = (e) => e.stopPropagation();
      document.addEventListener('click', () => pop.classList.remove('open'));
      document.getElementById('cache-clear-btn').onclick = async () => {
        try {
          const res = await fetch('/api/thumb-cache/clear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Asx-Session-Token': token },
            body: '{}',
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error('clear failed');
          showToast('已清除 ' + data.removed + ' 张缩略图缓存');
          refreshCacheStats();
          renderGrid();
        } catch (err) { showToast(err.message || '清除失败', 'error'); }
      };
    }

    function renderGrid() {
      const grid = document.getElementById('asset-grid');
      if (!state.assets.length) {
        const filtered = state.category !== 'all' || state.source !== 'all' || state.query || state.dir;
        grid.innerHTML = filtered
          ? `<div class="pl-empty grid-full"><strong>没有符合筛选条件的资产</strong><button type="button" class="keycap ghost sm" id="clear-filters-btn">清除筛选</button></div>`
          : `<div class="pl-empty grid-full"><strong>工作区里还没有资产</strong><span>用 Asynx Skill 生成或把文件放进工作区后，点「重新扫描」。</span></div>`;
        const clearBtn = document.getElementById('clear-filters-btn');
        if (clearBtn) clearBtn.onclick = clearFilters;
        return;
      }
      if (state.gridObserver) { state.gridObserver.disconnect(); state.gridObserver = null; }
      const CHUNK = 120;
      const renderCard = (asset) => {
        const badge = badgeInfo(asset);
        const isSel = asset.path === state.selectedPath;
        const checker = asset.category === 'image' || asset.category === 'frame_sequence';
        let thumbHtml = '';
        if (asset.category === 'image' || asset.category === 'frame_sequence') {
          thumbHtml = `<img src="${fileUrl(asset.path)}" loading="lazy" alt="${escapeHtml(asset.name)}" />`;
        } else if (asset.category === 'video') {
          thumbHtml = glyphHtml(asset) + thumbImgHtml(asset);
        } else {
          thumbHtml = glyphHtml(asset) + (asset.category === '3d' ? thumbImgHtml(asset) : '');
        }
        const tag = asset.model || asset.operation || asset.category;
        const frameTag = asset.category === 'frame_sequence' && asset.metadata && asset.metadata.frame_count
          ? `${asset.metadata.frame_count} 帧`
          : formatBytes(asset.bytes);
        const pCount = (asset.parents || []).length;
        const cCount = (asset.children || []).length;
        const linText = (pCount || cCount) ? `上游 ${pCount} · 下游 ${cCount}` : '';
        return `
          <div class="asset-card ${isSel ? 'selected' : ''}" data-path="${escapeHtml(asset.path)}">
            <div class="card-thumb ${checker ? 'checker' : ''}">
              ${thumbHtml}
              ${badge.flag ? `<span class="flag ${badge.flag}"><i>${escapeHtml(badge.label)}</i></span>` : ''}
            </div>
            <div class="card-body">
              <div class="card-name" title="${escapeHtml(asset.relative_path)}">${escapeHtml(asset.name)}</div>
              <div class="card-meta-row">
                <span class="pl-tag sm" title="${escapeHtml(tag)}">${escapeHtml(tag)}</span>
                <span>${escapeHtml(linText || frameTag)}</span>
              </div>
            </div>
          </div>
        `;
      };

      let rendered = 0;
      const sentinel = document.createElement('div');
      sentinel.style.cssText = 'grid-column: 1 / -1; height: 1px;';
      const appendChunk = () => {
        const end = Math.min(rendered + CHUNK, state.assets.length);
        const html = state.assets.slice(rendered, end).map(renderCard).join('');
        sentinel.insertAdjacentHTML('beforebegin', html);
        rendered = end;
        if (rendered >= state.assets.length) {
          sentinel.remove();
          if (state.gridObserver) { state.gridObserver.disconnect(); state.gridObserver = null; }
        }
      };
      grid.innerHTML = '';
      grid.appendChild(sentinel);
      appendChunk();
      if (rendered < state.assets.length) {
        state.gridObserver = new IntersectionObserver((entries) => {
          if (entries.some(e => e.isIntersecting)) appendChunk();
        }, { root: grid.closest('.grid-pane'), rootMargin: '800px' });
        state.gridObserver.observe(sentinel);
      }
      grid.onclick = (ev) => {
        const card = ev.target.closest('.asset-card');
        if (card && grid.contains(card)) selectAsset(card.dataset.path);
      };
    }

    async function selectAsset(pathOrTarget, opts) {
      let asset = state.assets.find(a => a.path === pathOrTarget || a.artifact_id === pathOrTarget);
      if (!asset && pathOrTarget) {
        // Fallback: clear filters if navigating via lineage to a hidden category
        try {
          const lin = await apiGet('/api/lineage?target=' + encodeURIComponent(pathOrTarget));
          if (lin && lin.path) {
            state.category = 'all';
            state.dir = '';
            state.source = 'all';
            state.query = '';
            document.getElementById('search-input').value = '';
            document.getElementById('source-filter').value = 'all';
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('on', b.dataset.cat === 'all'));
            state.selectedPath = lin.path;
            await loadAssets({ refetch: true });
            return;
          }
        } catch (err) {
          showToast('无法定位目标资产: ' + err.message, 'error');
          return;
        }
      }
      if (!asset) return;

      state.selectedPath = asset.path;
      if (!opts || !opts.skipGridRender) {
        document.querySelectorAll('.asset-card').forEach(el => {
          el.classList.toggle('selected', el.dataset.path === asset.path);
        });
      }

      try {
        state.lineage = await apiGet('/api/lineage?target=' + encodeURIComponent(asset.artifact_id || asset.path));
      } catch (_) {
        state.lineage = { asset: null, parents: asset.parents || [], children: asset.children || [], ancestors: [], descendants: [] };
      }
      renderInspector(asset);
    }

    // 仅刷新当前选中节点的 Asset Lineage，不重绘预览与操作面板

      renderLineageSection(asset, state.lineage || { parents: [], children: [], ancestors: [], descendants: [] });

        <div class="insp-section">

    function initPreviewStage(asset) {
      const stage = document.getElementById('insp-preview-stage');
      const url = fileUrl(asset.path);

      if (asset.category === 'image') {
        stage.innerHTML = `<img src="${url}" alt="${escapeHtml(asset.name)}" />`;

      }

      if (asset.category === 'video') {
        stage.innerHTML = `<video src="${url}" controls loop></video>`;
        return;
      }

      if (asset.category === 'audio') {
        stage.innerHTML = `
          <canvas id="audio-wave-canvas" width="400" height="90"></canvas>
          <audio id="audio-player" src="${url}" controls></audio>
        `;
        renderAudioWaveform(url);
        return;
      }

      if (asset.category === 'frame_sequence') {
        stage.style.maxHeight = 'none';
        stage.innerHTML = `
          <canvas id="sprite-canvas" class="wb-checker" width="192" height="192"></canvas>
          <div class="sprite-controls">
            <div class="sprite-row">
              <button type="button" class="pl-iconbtn" id="sp-play" aria-label="暂停">${plIcon('wb-pause', 'i sm')}</button>
              <label>帧率 <input type="number" class="pl-input sm" id="sp-fps" value="10" min="1" max="60"></label>
              <label>方向 <select class="pl-input sm" id="sp-dir"><option value="all">全部帧</option></select></label>
              <span id="sp-counter" class="num">0 / 0</span>
            </div>
            <div class="sprite-row">
              <input type="range" id="sp-scrub" min="0" max="0" value="0" aria-label="帧位置">
              <label class="pl-check sm"><input type="checkbox" id="sp-onion">洋葱皮</label>
              <label class="pl-check sm"><input type="checkbox" id="sp-grid">网格</label>
            </div>
          </div>
        `;
        initFrameSequencePlayer(asset);
        return;
      }

      if (asset.category === '3d') {
        stage.innerHTML = `<div class="three-wrap"><canvas id="three-preview-canvas" width="420" height="220"></canvas><div class="anim-overlay" id="three-anim-overlay" hidden><select class="pl-input sm" id="three-anim-select" aria-label="动画片段"></select><button type="button" class="pl-iconbtn plain" id="three-anim-toggle" aria-label="暂停">${plIcon('wb-pause', 'i sm')}</button></div></div><div id="three-preview-meta">正在载入模型…</div>`;

    async function renderAudioWaveform(url) {
      const canvas = document.getElementById('audio-wave-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = plColor('--n950');
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      try {
        const resp = await fetch(url);
        const buf = await resp.arrayBuffer();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) throw new Error('no audio ctx');
        const audioCtx = new AudioCtx();
        const decoded = await audioCtx.decodeAudioData(buf);
        const data = decoded.getChannelData(0);
        const step = Math.max(1, Math.floor(data.length / canvas.width));
        const mid = canvas.height / 2;
        ctx.fillStyle = plColor('--n300');
        for (let x = 0; x < canvas.width; x++) {
          let min = 1, max = -1;
          for (let j = 0; j < step; j++) {
            const v = data[x * step + j] || 0;
            if (v < min) min = v;
            if (v > max) max = v;
          }
          const h = Math.max(2, (max - min) * mid * 0.9);
          ctx.fillRect(x, mid - h / 2, 1, h);
        }
        audioCtx.close().catch(() => {});
      } catch (_) {
        ctx.fillStyle = plColor('--n700');
        for (let x = 8; x < canvas.width - 8; x += 6) {
          const h = 14 + Math.round(Math.abs(Math.sin(x * 0.15)) * 44);
          ctx.fillRect(x, (canvas.height - h) / 2, 3, h);
        }
      }
    }

    async function initFrameSequencePlayer(asset) {
      const canvas = document.getElementById('sprite-canvas');
      const ctx = canvas.getContext('2d');
      const mPath = asset.metadata && asset.metadata.manifest_path;
      if (!mPath) {
        ctx.fillStyle = plColor('--n400');
        ctx.font = `13px ${plColor('--cn')}`;
        ctx.fillText('没有找到 manifest.json', 20, 40);
        return;
      }
      let manifest;
      try {
        const res = await fetch('/api/manifest?token=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(mPath));
        manifest = await res.json();
      } catch (_) {
        return;
      }

      const sp = state.spritePlayer;
      sp.manifest = manifest;
      sp.fps = Number(manifest.meta && manifest.meta.fps) || 10;
      document.getElementById('sp-fps').value = sp.fps;

      const framesObj = manifest.frames || {};
      const allEntries = Array.isArray(framesObj)
        ? framesObj.map((f, i) => ({ key: String(i), rect: f.frame || f, dir: f.direction || null }))
        : Object.keys(framesObj).map(k => ({ key: k, rect: framesObj[k].frame || framesObj[k], dir: framesObj[k].direction || null }));

      const dirs = Array.from(new Set(allEntries.map(e => e.dir).filter(Boolean)));
      const dirSelect = document.getElementById('sp-dir');
      dirSelect.innerHTML = `<option value="all">全部帧 (${allEntries.length})</option>` +
        dirs.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');

      const atlasImg = new Image();
      atlasImg.onload = () => {
        sp.img = atlasImg;
        function filteredEntries() {
          if (sp.direction === 'all') return allEntries;
          return allEntries.filter(e => e.dir === sp.direction);
        }
        function drawFrame(idx) {
          const list = filteredEntries();
          if (!list.length) return;
          sp.idx = ((idx % list.length) + list.length) % list.length;
          const entry = list[sp.idx];
          const r = entry.rect;
          canvas.width = r.w || 128;
          canvas.height = r.h || 128;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (sp.onionSkin && list.length > 1) {
            const prev = list[(sp.idx - 1 + list.length) % list.length].rect;
            ctx.save();
            ctx.globalAlpha = 0.28;
            ctx.drawImage(atlasImg, prev.x, prev.y, prev.w, prev.h, 0, 0, canvas.width, canvas.height);
            ctx.restore();
          }
          ctx.drawImage(atlasImg, r.x, r.y, r.w, r.h, 0, 0, canvas.width, canvas.height);
          if (sp.showGrid) {
            ctx.strokeStyle = plColor('--coin');
            ctx.lineWidth = 1;
            ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
          }
          document.getElementById('sp-counter').textContent = `${sp.idx + 1} / ${list.length}`;
          const scrub = document.getElementById('sp-scrub');
          scrub.max = Math.max(0, list.length - 1);
          scrub.value = sp.idx;
        }
        function restartTimer() {
          if (sp.timer) clearInterval(sp.timer);
          if (!sp.playing) return;
          sp.timer = setInterval(() => drawFrame(sp.idx + 1), Math.max(16, 1000 / sp.fps));
        }

          const btn = document.getElementById('sp-play');
          btn.innerHTML = plIcon(sp.playing ? 'wb-pause' : 'pi-play', 'i sm');
          btn.setAttribute('aria-label', sp.playing ? '暂停' : '播放');
        };
        document.getElementById('sp-play').onclick = () => {
          sp.playing = !sp.playing;
          renderPlayBtn();
          restartTimer();
        };
        document.getElementById('sp-fps').onchange = (e) => {
          sp.fps = Math.max(1, Math.min(60, Number(e.target.value) || 10));
          restartTimer();
        };
        dirSelect.onchange = (e) => {
          sp.direction = e.target.value;
          sp.idx = 0;
          drawFrame(0);
        };
        document.getElementById('sp-scrub').oninput = (e) => {
          sp.playing = false;
          renderPlayBtn();
          if (sp.timer) clearInterval(sp.timer);
          drawFrame(Number(e.target.value));
        };
        document.getElementById('sp-onion').onchange = (e) => { sp.onionSkin = e.target.checked; drawFrame(sp.idx); };
        document.getElementById('sp-grid').onchange = (e) => { sp.showGrid = e.target.checked; drawFrame(sp.idx); };
        drawFrame(0);
        restartTimer();
      };
      atlasImg.src = fileUrl(asset.path);
    }

    function initThreePreview(asset) {
      const canvas = document.getElementById('three-preview-canvas');
      const metaEl = document.getElementById('three-preview-meta');
      if (!canvas) return;
      if (!window.THREE) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = plColor('--n950');
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = plColor('--n400');
        ctx.font = `13px ${plColor('--cn')}`;
        ctx.fillText(`3D Asset: ${asset.name} (${asset.ext})`, 20, 105);
        if (metaEl) metaEl.textContent = `3D Asset: ${asset.name} (${asset.ext})`;
        return;
      }
      try {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(plColor('--n950'));
        const camera = new THREE.PerspectiveCamera(45, canvas.width / canvas.height, 0.1, 100);
        camera.position.set(0, 0.9, 3.2);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.width, canvas.height, false);
        if (window.AsxModel3DLoader) window.AsxModel3DLoader.setupStudioLighting(THREE, renderer, scene);

        let meshRoot = null;
        let mixer = null;
        let curAction = null;
        let paused = false;
        const clock = new THREE.Clock();
        let disposed = false;
        let rafId = 0;
        let dragging = false, prevX = 0;
        canvas.onpointerdown = (e) => { dragging = true; prevX = e.clientX; };
        const onPointerUp = () => { dragging = false; };
        window.addEventListener('pointerup', onPointerUp);
        canvas.onpointermove = (e) => {
          if (!dragging || !meshRoot) return;
          meshRoot.rotation.y += (e.clientX - prevX) * 0.012;
          prevX = e.clientX;
        };

        const loader = window.AsxModel3DLoader;
        if (loader) {
          loader.loadModelFromUrl(
            THREE,
            fileUrl(asset.path),
            asset.name,
            { headers: { 'X-Asx-Session-Token': token } }
          ).then((loaded) => {
            if (disposed) {
              loader.disposeObject3D(loaded.root);
              return;
            }
            meshRoot = loaded.root;
            scene.add(meshRoot);
            const clips = (loaded.stats && loaded.stats.clips) || [];
            if (clips.length) {
              mixer = new THREE.AnimationMixer(meshRoot);
              const overlay = document.getElementById('three-anim-overlay');
              const sel = document.getElementById('three-anim-select');
              const tog = document.getElementById('three-anim-toggle');
              sel.innerHTML = clips.map((c, i) => `<option value="${i}">${escapeHtml(c.name || 'clip_' + (i + 1))}</option>`).join('');
              const play = (i) => {
                if (curAction) curAction.stop();
                curAction = mixer.clipAction(clips[i]);
                curAction.reset().play();
                curAction.paused = paused;
              };
              sel.onchange = () => play(Number(sel.value));
              tog.onclick = () => {
                paused = !paused;
                if (curAction) curAction.paused = paused;
                tog.innerHTML = plIcon(paused ? 'pi-play' : 'wb-pause', 'i sm');
                tog.setAttribute('aria-label', paused ? '播放' : '暂停');
              };
              overlay.hidden = false;
              play(0);
            }
            if (metaEl) {
              const st = loaded.stats || {};
              metaEl.textContent = st.isFallback
                ? `${asset.ext || '3D'} 代理预览 (${st.fallbackReason || '暂不支持直接网格解析'})`
                : `${st.format} · ${st.vertices} 顶点 · ${st.faces} 面${st.animations && st.animations.length ? ` · ${st.animations.length} 段动画` : ''}`;
            }
          });
        }

        function loop() {
          rafId = requestAnimationFrame(loop);
          const dt = clock.getDelta();
          if (mixer && !paused) mixer.update(dt);
          if (!dragging && meshRoot && !mixer) meshRoot.rotation.y += 0.006;
          renderer.render(scene, camera);
        }
        loop();
        state.threeCleanup = () => {
          disposed = true;
          cancelAnimationFrame(rafId);
          window.removeEventListener('pointerup', onPointerUp);
          if (meshRoot && loader) loader.disposeObject3D(meshRoot);
          renderer.dispose();
        };
      } catch (_) {}
    }

    function renderLineageDag(container, asset, lin) {
      const edges = [...(lin.ancestors || []), ...(lin.descendants || [])];
      if (!edges.length) {
        container.innerHTML = `<div class="lineage-none">这个资产还没有血缘连线</div>`;
        return;
      }
      const nodesMap = new Map();
      const addNode = (id, path) => {
        const key = path || id;
        if (!nodesMap.has(key)) {
          nodesMap.set(key, { key, id, path, label: (path || id || '').split('/').pop(), depth: 0 });
        }
        return nodesMap.get(key);
      };
      const curKey = asset.path;
      addNode(asset.artifact_id, asset.path);

      const dedupEdges = [];
      const seenEdge = new Set();
      for (const e of edges) {
        const eid = `${e.parent_path}->${e.child_path}:${e.operation}`;
        if (seenEdge.has(eid)) continue;
        seenEdge.add(eid);
        dedupEdges.push(e);
        addNode(e.parent_artifact_id, e.parent_path);
        addNode(e.child_artifact_id, e.child_path);
      }

      // Compute topological layer depths relative to root ancestors
      for (let pass = 0; pass < nodesMap.size; pass++) {
        for (const e of dedupEdges) {
          const p = nodesMap.get(e.parent_path);
          const c = nodesMap.get(e.child_path);
          if (p && c && c.depth <= p.depth) c.depth = p.depth + 1;
        }
      }
      const byDepth = new Map();
      for (const node of nodesMap.values()) {
        if (!byDepth.has(node.depth)) byDepth.set(node.depth, []);
        byDepth.get(node.depth).push(node);
      }
      const depths = Array.from(byDepth.keys()).sort((a, b) => a - b);
      const colW = 156, rowH = 56;
      let maxRows = 1;
      for (const d of depths) {
        const arr = byDepth.get(d);
        maxRows = Math.max(maxRows, arr.length);
        arr.forEach((n, idx) => {
          n.x = 14 + d * colW;
          n.y = 14 + idx * rowH;
        });
      }
      const svgW = Math.max(360, depths.length * colW + 24);
      const svgH = Math.max(120, maxRows * rowH + 20);

      const linesSvg = dedupEdges.map(e => {
        const p = nodesMap.get(e.parent_path);
        const c = nodesMap.get(e.child_path);
        if (!p || !c) return '';
        const x1 = p.x + 122, y1 = p.y + 18;
        const x2 = c.x, y2 = c.y + 18;
        const cx = (x1 + x2) / 2;
        return `
          <path class="dag-edge" d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" />
          <text class="dag-op" x="${cx}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle">${escapeHtml(e.operation)}</text>
        `;
      }).join('');

      const nodesSvg = Array.from(nodesMap.values()).map(n => {
        const isCurrent = n.key === curKey;
        return `
          <g class="dag-node${isCurrent ? ' cur' : ''}" data-target="${escapeHtml(n.id || n.path)}">
            <rect x="${n.x}" y="${n.y}" width="122" height="36" rx="8" />
            <text x="${n.x + 10}" y="${n.y + 23}">${escapeHtml(n.label.slice(0, 13))}</text>
          </g>
        `;
      }).join('');

      container.innerHTML = `<div class="dag-box"><svg width="${svgW}" height="${svgH}">${linesSvg}${nodesSvg}</svg></div>`;
      container.querySelectorAll('.dag-node').forEach(g => {
        g.onclick = () => selectAsset(g.dataset.target);
      });
    }

    async function runAction(payload, opts) {
      if (state.busyAction) return;
      state.busyAction = true;
      setActionsBusy(true, opts && opts.btn);
      const resultSlot = document.getElementById('action-result-slot');
      if (resultSlot) resultSlot.innerHTML = `<div class="action-result-box">正在执行 ${escapeHtml(payload.action)}…</div>`;
      try {
        const res = await apiAction(payload);
        showToast(`操作 ${payload.action} 完成`, 'success');
        if (resultSlot) {
          resultSlot.innerHTML = `<div class="action-result-box">${escapeHtml(JSON.stringify(res.result || res, null, 2))}</div>`;
        }
        // 保持当前选中节点不变，仅局部刷新其血缘关系（新派生资产会出现在子节点中）
        await loadAssets({ noCache: true, lineageOnly: true });
      } catch (err) {
        if (err.code === 'need_login' || err.status === 401) {
          showToast('云端操作需要 Plaiers Agent 授权（skill_jwt 权限），请经 plaiers-community 授权并用 get_skill 安装本 Skill', 'error');
        } else {
          showToast(err.message, 'error');
        }
        if (resultSlot) resultSlot.innerHTML = `<div class="action-result-box err">${escapeHtml(err.message)}</div>`;
      } finally {
        state.busyAction = false;
        setActionsBusy(false);
      }
    }

    function initAnimCombo(root) {
      const btn = root.querySelector('.combo-btn');
      const label = btn.querySelector('span');
      const filter = root.querySelector('.combo-filter');
      const list = root.querySelector('.combo-list');
      root.dataset.value = '[]';
      const sel = () => JSON.parse(root.dataset.value);
      const refreshLabel = () => {
        const v = sel();
        label.textContent = v.length ? (v.length <= 2 ? v.join(', ') : `已选 ${v.length} 个动画`) : '选择动画（可多选）';
      };
      const render = () => {
        const q = filter.value.trim().toLowerCase();
        const groups = state.animPresets || {};
        let html = '';
        for (const [g, items] of Object.entries(groups)) {
          const m = items.filter((i) => i.toLowerCase().includes(q));
          if (!m.length) continue;
          html += `<div class="combo-group">${escapeHtml(g)}</div>` + m.map((i) =>
            `<div class="combo-item ${sel().includes(i) ? 'sel' : ''}" data-v="${escapeHtml(i)}" role="option" aria-selected="${sel().includes(i)}">${escapeHtml(i)}</div>`).join('');
        }
        list.innerHTML = html || '<div class="combo-group">无匹配动画</div>';
      };
      btn.onclick = async () => {
        if (root.classList.toggle('open')) {
          label.textContent = '载入中…';
          try { await loadAnimationPresets(); } catch (e) { showToast(e.message, 'error'); }
          refreshLabel();
          filter.value = '';
          render();
          filter.focus();
        }
      };
      filter.oninput = render;
      list.onclick = (ev) => {
        const it = ev.target.closest('.combo-item');
        if (!it) return;
        const cur = sel();
        const i = cur.indexOf(it.dataset.v);
        if (i >= 0) cur.splice(i, 1);
        else if (cur.length >= 5) return showToast('每个任务最多选择 5 个动画', 'error');
        else cur.push(it.dataset.v);
        root.dataset.value = JSON.stringify(cur);
        refreshLabel();
        render();
        const ab = document.getElementById('btn-3d-anim');
        if (ab) ab.disabled = ab.dataset.keepDisabled === '1' || !cur.length;
      };
    }

      }

      if (asset.category === 'frame_sequence') {
        const mPath = (asset.metadata && asset.metadata.manifest_path) || '';
        container.innerHTML = `
          <div class="action-group">
            <h4>预览与解包</h4>
            <div class="btn-row">
              <button class="keycap ghost sm" id="btn-emb-seq-prev">大窗预览</button>
              <button class="keycap ghost sm" id="btn-fs-extract">拆成单帧 PNG</button>
            </div>
          </div>
          <div class="action-group">
            <h4>重新切分</h4>
            <div class="field-grid">
              <div><label class="fl">新行数</label><input class="pl-input" type="number" id="act-repack-rows" value="${(asset.metadata && asset.metadata.rows) || 2}"></div>
              <div><label class="fl">新列数</label><input class="pl-input" type="number" id="act-repack-cols" value="${(asset.metadata && asset.metadata.columns) || 2}"></div>
              <div><label class="fl">帧率</label><input class="pl-input" type="number" id="act-repack-fps" value="${(asset.metadata && asset.metadata.fps) || 10}"></div>
            </div>
            <div class="btn-row"><button class="keycap sm" id="btn-fs-repack">重新切分并生成图集</button></div>
          </div>
        `;
        document.getElementById('btn-emb-seq-prev').onclick = () =>
          openEmbeddedWorkbench('序列帧预览', `/video/index.html?embedded=1&mode=sequence_preview&token=${encTok}&source_path=${encSrc}&manifest_path=${encodeURIComponent(mPath)}`);
        document.getElementById('btn-fs-extract').onclick = () => runAction({
          action: 'frame_sequence_extract_frames',
          source_path: src,
          manifest_path: mPath || undefined,
        });
        document.getElementById('btn-fs-repack').onclick = () => runAction({
          action: 'frame_sequence_repack',
          source_path: src,
          manifest_path: mPath || undefined,
          rows: Number(document.getElementById('act-repack-rows').value) || 2,
          columns: Number(document.getElementById('act-repack-cols').value) || 2,
          fps: Number(document.getElementById('act-repack-fps').value) || 10,
        });
        return;
      }

      if (asset.category === 'video') {
        const audioOpts = state.assets.filter(a => a.category === 'audio')
          .map(a => `<option value="${escapeHtml(a.path)}">${escapeHtml(a.name)}</option>`).join('');
        container.innerHTML = `
          <div class="action-group">
            <h4>抽帧成序列帧图集</h4>
            <div class="btn-row">
              <button class="keycap sm" id="btn-emb-vid-fs">打开抽帧工作台</button>
              <button class="keycap ghost sm" id="btn-vid-sheet">直接按 10 FPS 生成</button>
            </div>
          </div>
          <div class="action-group">
            <h4>用一句话改 <small>video.edit</small></h4>
            <div class="field-full">
              <label class="fl">修改要求</label>
              <input class="pl-input" id="act-vedit-prompt" placeholder="例如：添加赛博朋克霓虹雨夜氛围" />
            </div>
            <div class="btn-row"><button class="keycap ghost sm" id="btn-vid-edit">开始编辑</button></div>
          </div>
          <div class="action-group">
            <h4>本地处理</h4>
            <div class="field-grid">
              <div><label class="fl">保留时长（秒，从头开始）</label><input class="pl-input" id="act-vtrim-dur" type="number" value="2" step="0.5"></div>
              <div><label class="fl">格式转换</label><select class="pl-input" id="act-vconv-fmt"><option value="gif">GIF</option><option value="webm">WebM</option><option value="mp4">MP4</option></select></div>
            </div>
            <div class="btn-row">
              <button class="keycap ghost sm" id="btn-vid-trim">修剪</button>
              <button class="keycap ghost sm" id="btn-vid-conv">转码</button>
            </div>
            ${audioOpts ? `
              <div class="field-full">
                <label class="fl">配上音频</label>
                <div class="mux-row">
                  <select class="pl-input" id="act-vmux-audio">${audioOpts}</select>
                  <button class="keycap ghost sm" id="btn-vid-mux">合并</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
        document.getElementById('btn-emb-vid-fs').onclick = () =>
          openEmbeddedWorkbench('视频抽帧', `/video/index.html?embedded=1&mode=video_frame_sequence&token=${encTok}&source_path=${encSrc}`);
        document.getElementById('btn-vid-sheet').onclick = () => runAction({
          action: 'video_spritesheet',
          source_path: src,
          fps: 10,
        });
        document.getElementById('btn-vid-edit').onclick = () => runAction({
          action: 'video_edit',
          source_path: src,
          prompt: document.getElementById('act-vedit-prompt').value.trim(),
        });
        document.getElementById('btn-vid-trim').onclick = () => runAction({
          action: 'video_trim',
          source_path: src,
          start: 0,
          duration: Number(document.getElementById('act-vtrim-dur').value) || 2,
        });
        document.getElementById('btn-vid-conv').onclick = () => runAction({
          action: 'video_convert',
          source_path: src,
          format: document.getElementById('act-vconv-fmt').value,
        });
        const muxBtn = document.getElementById('btn-vid-mux');
        if (muxBtn) {
          muxBtn.onclick = () => runAction({
            action: 'video_mux',
            source_path: src,
            audio_path: document.getElementById('act-vmux-audio').value,
          });
        }
        return;
      }

      if (asset.category === '3d') {
        container.innerHTML = `
          <div class="action-group">
            <h4>多视角序列帧渲染</h4>
            <div class="btn-row"><button class="keycap sm" id="btn-emb-3d">打开渲染工作台</button></div>
          </div>
          <div class="action-group">
            <h4>骨骼绑定与动画 <small>仅限 Asynx 生成的模型</small></h4>
            <div class="field-grid">
              <div><label class="fl">骨骼类型</label><select class="pl-input" id="act-3d-rigtype"><option value="auto">auto</option><option value="biped">biped</option><option value="quadruped">quadruped</option><option value="hexapod">hexapod</option><option value="octopod">octopod</option><option value="avian">avian</option><option value="serpentine">serpentine</option><option value="aquatic">aquatic</option><option value="others">others</option></select></div>
              <div><label class="fl">动画</label>
                <div class="combo" id="act-3d-anim">
                  <button type="button" class="pl-input combo-btn"><span>选择动画（可多选）</span><span aria-hidden="true">▾</span></button>
                  <div class="combo-pop menu"><input class="pl-input sm combo-filter" placeholder="筛选动画" /><div class="combo-list" role="listbox" aria-multiselectable="true"></div></div>
                </div>
              </div>
            </div>
            <div id="rig-status">正在检测骨骼…</div>
            <div class="btn-row">
              <button class="keycap sm" id="btn-3d-rig">自动绑骨</button>
              <button class="keycap sm" id="btn-3d-anim">套用动画</button>
            </div>
          </div>
          <div class="action-group">
            <h4>格式转换</h4>
            <div class="field-grid">
              <div><label class="fl">目标格式</label><select class="pl-input" id="act-3d-convfmt"><option value="fbx">FBX</option><option value="gltf">GLB (gltf)</option><option value="obj">OBJ (zip)</option><option value="usdz">USDZ</option><option value="stl">STL</option></select></div>
            </div>
            <div class="btn-row">
              <button class="keycap ghost sm" id="btn-3d-conv">转换</button>
            </div>
          </div>
          <div class="action-group">
            <h4>本地检查</h4>
            <div class="btn-row">
              <button class="keycap ghost sm" id="btn-3d-info">查看模型信息</button>
              <button class="keycap ghost sm" id="btn-3d-val">校验 PBR 与面</button>
              <button class="keycap ghost sm" id="btn-3d-ex">提取贴图</button>
            </div>
          </div>
        `;
        document.getElementById('btn-emb-3d').onclick = () =>
          openEmbeddedWorkbench('3D 序列帧渲染', `/3d/index.html?embedded=1&mode=model3d_render_sequence&token=${encTok}&source_path=${encSrc}`);
        const rigBtn = document.getElementById('btn-3d-rig');
        const animBtn = document.getElementById('btn-3d-anim');
        const convBtn = document.getElementById('btn-3d-conv');
        const animCombo = document.getElementById('act-3d-anim');
        initAnimCombo(animCombo);
        animBtn.disabled = true;
        animBtn.dataset.keepDisabled = '1';
        rigBtn.disabled = true;
        rigBtn.dataset.keepDisabled = '1';
        (async () => {
          const status = document.getElementById('rig-status');
          try {
            const res = await apiAction({ action: 'model3d_info', source_path: src });
            if (state.selectedPath !== src || !status) return;
            const m = res.result.model || {};
            const skels = m.skeletons || [];
            if (m.joint_count > 0) {
              status.textContent = '已绑定骨骼：' + (skels.map((k) => `${k.name} (${k.joint_count} 关节)`).join(', ') || `${m.joint_count} 关节`);
              rigBtn.dataset.keepDisabled = '1';
              rigBtn.disabled = true;
              animBtn.dataset.keepDisabled = '0';
            } else {
              status.textContent = '未检测到骨骼';
              rigBtn.dataset.keepDisabled = '0';
              rigBtn.disabled = state.busyAction;
            }
            animBtn.disabled = state.busyAction || animBtn.dataset.keepDisabled === '1' || JSON.parse(animCombo.dataset.value).length === 0;
          } catch (e) {
            if (status) status.textContent = '骨骼检测失败：' + e.message;
            rigBtn.dataset.keepDisabled = '0';
            rigBtn.disabled = false;
            animBtn.dataset.keepDisabled = '0';
            animBtn.disabled = false;
          }
        })();
        rigBtn.onclick = () => runAction({ action: 'model3d_auto_rig', source_path: src, rig_type: document.getElementById('act-3d-rigtype').value }, { btn: rigBtn });
        animBtn.onclick = () => {
          const anims = JSON.parse(animCombo.dataset.value);
          if (!anims.length) return showToast('请先选择动画', 'error');
          runAction({ action: 'model3d_animate', source_path: src, animations: anims }, { btn: animBtn });
        };
        convBtn.onclick = () => runAction({ action: 'model3d_convert', source_path: src, output_format: document.getElementById('act-3d-convfmt').value }, { btn: convBtn });
        document.getElementById('btn-3d-info').onclick = () => runAction({ action: 'model3d_info', source_path: src }, { selectCreated: false });
        document.getElementById('btn-3d-val').onclick = () => runAction({ action: 'model3d_validate', source_path: src, require_pbr: true }, { selectCreated: false });
        document.getElementById('btn-3d-ex').onclick = () => runAction({ action: 'model3d_extract_textures', source_path: src });
        return;
      }

      if (asset.category === 'audio') {
        container.innerHTML = `
          <div class="action-group">
            <h4>用这个音色说台词 <small>audio.speech</small></h4>
            <div class="field-full">
              <label class="fl">台词（当前音频作为参考音色）</label>
              <textarea class="pl-input" id="act-aud-text" placeholder="输入需要朗读的角色台词..."></textarea>
            </div>
            <div class="btn-row"><button class="keycap sm" id="btn-aud-speech">合成语音</button></div>
          </div>
          <div class="action-group">
            <h4>本地处理</h4>
            <div class="field-grid">
              <div><label class="fl">保留时长（秒）</label><input class="pl-input" type="number" id="act-aud-dur" value="1.5" step="0.1"></div>
              <div><label class="fl">目标格式</label><select class="pl-input" id="act-aud-fmt"><option value="wav">WAV</option><option value="mp3">MP3</option><option value="ogg">OGG</option></select></div>
            </div>
            <div class="btn-row">
              <button class="keycap ghost sm" id="btn-aud-trim">修剪</button>
              <button class="keycap ghost sm" id="btn-aud-fade">淡入淡出</button>
              <button class="keycap ghost sm" id="btn-aud-norm">响度标准化</button>
              <button class="keycap ghost sm" id="btn-aud-conv">转码</button>
            </div>
          </div>
        `;
        document.getElementById('btn-aud-speech').onclick = () => runAction({
          action: 'audio_speech',
          source_path: src,
          text: document.getElementById('act-aud-text').value.trim(),
        });
        document.getElementById('btn-aud-trim').onclick = () => runAction({
          action: 'audio_trim',
          source_path: src,
          start: 0,
          duration: Number(document.getElementById('act-aud-dur').value) || 1.5,
        });
        document.getElementById('btn-aud-fade').onclick = () => runAction({
          action: 'audio_fade',
          source_path: src,
          fade_in: 0.2,
          fade_out: 0.2,
        });
        document.getElementById('btn-aud-norm').onclick = () => runAction({
          action: 'audio_normalize',
          source_path: src,
          target_lufs: -14.0,
        });
        document.getElementById('btn-aud-conv').onclick = () => runAction({
          action: 'audio_convert',
          source_path: src,
          format: document.getElementById('act-aud-fmt').value,
        });
      }
    }

    async function init() {
      initCacheMenu();
      if (window.AsxAccountBar) {
        window.AsxAccountBar.mount('#account-bar-slot', {
          token,
          onAuthChange: () => {},
        });
      }

      document.getElementById('tree-toggle-btn').onclick = () => {
        const collapsed = document.getElementById('tree-pane').classList.toggle('collapsed');
        document.getElementById('tree-toggle-btn').setAttribute('aria-expanded', String(!collapsed));
      };

      document.getElementById('tree-pane').addEventListener('click', (e) => {
        const row = e.target.closest('.tree-row');
        if (!row) return;
        const dir = row.dataset.dir;
        if (e.target.closest('[data-toggle]')) {
          if (state.collapsed.has(dir)) state.collapsed.delete(dir); else state.collapsed.add(dir);
          renderTree();
          return;
        }
        state.dir = dir;
        loadAssets();
      });

      document.getElementById('category-tabs').querySelectorAll('.cat-tab').forEach(btn => {
        btn.onclick = () => {
          state.category = btn.dataset.cat;
          document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('on', b === btn));
          loadAssets();
        };
      });

      document.getElementById('source-filter').onchange = (e) => {
        state.source = e.target.value;
        loadAssets();
      };

      let searchTimer = null;
      document.getElementById('search-input').oninput = (e) => {
        state.query = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadAssets(), 180);
      };

      document.getElementById('rescan-btn').onclick = () => loadAssets({ noCache: true });
      document.getElementById('embedded-close-btn').onclick = closeEmbeddedWorkbench;
      document.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape') return;
        const modal = document.getElementById('embedded-modal');
        if (modal && modal.classList.contains('open')) closeEmbeddedWorkbench();
      });

      window.addEventListener('message', async (ev) => {
        if (!ev.data || typeof ev.data !== 'object') return;
        if (ev.data.type === 'asx-workbench-cancel') {
          closeEmbeddedWorkbench();
          return;
        }
        if (ev.data.type === 'asx-workbench-complete') {
          closeEmbeddedWorkbench();
          showToast('子工作台操作完成并已同步血缘关系', 'success');
          await loadAssets({ noCache: true, lineageOnly: true });
        }
      });

      try {
        state.session = await apiGet('/api/session');
        const wsRoot = state.session.metadata && state.session.metadata.workspace_root;
        const wsEl = document.getElementById('workspace-root-label');
        wsEl.textContent = wsRoot ? ('工作区 ' + wsRoot.split('/').pop()) : '工作区 --';
        wsEl.title = wsRoot || '';
      } catch (err) {
        showToast('初始化会话失败: ' + err.message, 'error');
      }

      await loadAssets();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
